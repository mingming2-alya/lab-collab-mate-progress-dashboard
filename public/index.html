<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SW AI 推動全貌</title>
<style>
/* 總覽（給副總）：一頁不滾動，看清楚單位本週動作。
   結構：項目 → 需求。進度、本週完成、下週要完成都算在需求上；項目只負責分組。
   沿用每日進度頁的設計 token（同配色、字體、狀態語意）。 */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --fg:#18212B; --muted:#5D6B7A; --line:#DCE2E8; --seg:#D3DAE1;
  --accent:#1E5A86; --accent-soft:#E3EDF5;
  --ok:#1F7A4D; --ok-soft:#E2F2E9; --warn:#A86200; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE4E2;
  --idle:#66727F; --idle-soft:#E8ECF0; --new:#6A3FB5; --new-soft:#EEE6FA;
  --f-display:"Noto Serif TC","Noto Serif CJK TC","Songti TC","Songti SC","STSong","PMingLiU","SimSun",serif;
  --f-body:"PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19212A; --fg:#E6ECF1; --muted:#97A5B3; --line:#2B3642; --seg:#33404D;
  --accent:#7FB6E0; --accent-soft:#1D3243;
  --ok:#5CC48C; --ok-soft:#173527; --warn:#F0B055; --warn-soft:#3A2A12; --bad:#F2857C; --bad-soft:#3E1D1B;
  --idle:#A3B0BD; --idle-soft:#26303A; --new:#C3A6F2; --new-soft:#2E2442;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19212A; --fg:#E6ECF1; --muted:#97A5B3; --line:#2B3642; --seg:#33404D;
  --accent:#7FB6E0; --accent-soft:#1D3243;
  --ok:#5CC48C; --ok-soft:#173527; --warn:#F0B055; --warn-soft:#3A2A12; --bad:#F2857C; --bad-soft:#3E1D1B;
  --idle:#A3B0BD; --idle-soft:#26303A; --new:#C3A6F2; --new-soft:#2E2442;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1600px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 14px;display:flex;flex-direction:column;gap:10px}
h1,h2{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}

/* 分頁 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs a{font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 13px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* 頁首：標題＋週次（左）、三個數字（右） */
header.page{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-display);font-size:24px;line-height:1.25;font-weight:700}
.week{font-size:13px;color:var(--muted);margin-top:2px}
.week b{color:var(--fg)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:5px 14px 6px;min-width:128px}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;line-height:1.15;color:var(--c)}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.headline{font-size:13.5px;margin:3px 0 0}
.headline b{color:var(--fg)}

/* 需要副總支援：有事項時才出現 */
.help{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:baseline;padding:7px 12px;background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;font-size:13.5px}
.help .k{font-weight:700;color:var(--bad)}

/* 主表：項目欄＋需求列 */
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cols{display:grid;grid-template-columns:200px minmax(0,1.25fr) minmax(0,1fr) minmax(0,.9fr);gap:0 16px;align-items:start}
.thead{display:grid;grid-template-columns:132px minmax(0,1fr);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;background:var(--bg);border-bottom:1px solid var(--line)}
.thead > span,.thead .cols > span{padding:6px 0}
.thead > span:first-child{padding-left:14px}
.proj{display:grid;grid-template-columns:132px minmax(0,1fr);border-top:1px solid var(--line)}
.proj:first-of-type{border-top:0}
.pname{padding:8px 10px 8px 14px;font-weight:700;font-size:14px;line-height:1.35;border-right:1px solid var(--line);background:var(--bg)}
.pname small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.req{padding:7px 16px 7px 0;border-top:1px solid var(--line);margin-left:14px}
.req:first-child{border-top:0}
.rn{font-weight:700;line-height:1.35}
.rn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.rn small .rel{margin-left:6px}
.rel{display:inline-block;font-size:11.5px;color:var(--new);background:var(--new-soft);padding:0 6px;border-radius:4px;font-weight:700}

/* 進度欄 */
.pgl{display:flex;align-items:center;gap:10px;min-width:0}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;width:150px;flex:none}
.track i{height:7px;border-radius:2px;background:var(--seg)}
.track i.done{background:var(--accent);opacity:.45}
.track i.now{background:var(--accent)}
.pg{font-size:13px;line-height:1.45;min-width:0}
.pg b{color:var(--fg)}
.subs{font-size:12px;color:var(--muted);margin-top:1px}
.subs b{color:var(--fg);font-weight:600}
.ms{font-size:12px;color:var(--muted);margin-top:1px}
.ms b{color:var(--fg)}
.wait{font-size:12px;font-weight:700;color:var(--idle);background:var(--idle-soft);padding:0 7px;border-radius:4px;display:inline-block}
.nums{display:flex;gap:14px;font-size:13px;margin-top:2px}
.nums b{font-family:var(--f-mono);font-size:15px}

/* 本週完成／下週 */
.list{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.45}
.list li{position:relative;padding-left:16px}
.list.done li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}
.list.next li::before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:700}
.last{font-size:12px;color:var(--muted);line-height:1.4}

footer{font-size:11.5px;color:var(--muted);display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{display:inline-block;width:16px;height:7px;border-radius:2px;background:var(--seg)}
.lg i.done{background:var(--accent);opacity:.45}
.lg i.now{background:var(--accent)}
footer a{color:var(--accent)}

/* 矮螢幕（如筆電 1440×900）再壓縮，維持單屏 */
@media (min-width:901px) and (max-height:960px){
  .wrap{gap:8px;padding-block:8px 10px}
  h1{font-size:21px}
  .stat{padding:3px 12px 4px}
  .stat b{font-size:20px}
  .req{padding-block:4px}
  .pg,.list{font-size:12.5px}
  .rn{font-size:13.5px}
  .pname{padding-block:6px}
}

/* 手機與平板：每個需求一張卡片 */
@media (max-width:900px){
  .thead{display:none}
  .proj{grid-template-columns:1fr}
  .pname{border-right:0;border-bottom:1px solid var(--line)}
  .req{margin-left:0;padding:9px 14px}
  .cols{grid-template-columns:1fr;gap:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" aria-label="頁面"><a href="./" aria-current="page">總覽</a><a href="daily.html">每日進度</a><a href="arch.html">架構全貌</a></nav>
  <header class="page">
    <div>
      <div class="eyebrow">SW ・ AI 推動全貌</div>
      <h1>本週進度</h1>
      <div class="week" id="week"></div>
      <p class="headline" id="headline"></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="help" id="help" hidden></div>
  <main class="board" id="board" aria-label="各項目與需求"></main>
  <footer>
    <span class="lg"><i class="done"></i>已完成的步驟</span>
    <span class="lg"><i class="now"></i>目前步驟</span>
    <span class="lg"><i></i>未開始</span>
    <span>進度以負責人最近一次回報為準；里程碑日期為 PM 規劃的時程。</span>
    <span>Lab Collab Mate 的工作流細節見 <a href="daily.html">每日進度</a>。</span>
  </footer>
</div>
<script>
/* ===== 資料（每週由 PM 依負責人訊息回覆更新） =====
   WEEK：本週週次；ASOF：資料截至（手動設定，頁面所有時間計算以它為準，不隨瀏覽當天變動）。
   需求欄位：
     type   deliver＝交付型（照步驟做出東西）／research＝研究型（回答問題）／promo＝推廣型（讓更多人用）
     steps  交付型的時程步驟（短名稱）；null＝步驟待定
     subs   子項（例如工作流），各自目前步驟
     ms     PM 規劃的里程碑 [日期, 名稱]
     rel    與其他需求的關聯
     nums   推廣型要問的數字名稱
     rep    本週回報：{now:步驟索引或索引陣列（-1＝尚未開始）, done:[...], next:[...], help:"", conclusion:"", nums:{...}, subs:[...]}；null＝待回報
     last   最近一次的已知狀態（本週尚未回報時顯示）：{date, now, text, subs} */
const WEEK = {from:"2026-11-17", to:"2026-11-23"};
const ASOF = "2026-11-18";

const WF = ["設計規劃","節點開發","首次跑通","五次跑通","用戶驗收","上線"];
const SKILL = ["現況調研","技能設計","建置","實測驗證","推廣接入"];

const PROJECTS = [
  {name:"Lab Collab Mate", note:"4 個核心業務＋LabMind 接入", reqs:[
    {name:"客戶軟體驗證", type:"deliver", dri:"Simon、Gary、景棠、熙宁", steps:WF,
     ms:[["2026-11-18","Bundle 首次跑通"],["2026-11-20","proxima 首次跑通"],["2026-11-25","Bundle 五次跑通"],["2026-11-27","proxima 五次跑通、EFI 首次跑通"],["2026-12-02","EFI 五次跑通"],["2026-12-11","正式上線"]],
     rep:null,
     last:{date:"2026-11-11", now:1, subs:[["Bundle",1],["proxima",1],["EFI",-1]],
           text:"Bundle 4 個節點完成、串接 2 個並投入實際業務；proxima 2 個節點完成"}},
    {name:"產品 Panic 處理", type:"deliver", dri:"Simon、Gary、熙宁", steps:WF,
     ms:[["2026-11-27","串口方案定案"],["2026-12-01","開始工具開發與串連"],["2026-12-11","首次跑通"],["2026-12-18","五次跑通"],["2027-01-08","正式上線"]],
     rep:null, last:{date:"2026-11-11", now:-1}},
    {name:"產品測試軟體開發", type:"deliver", dri:"熙宁", steps:WF, rel:"Codio", relLong:"調研 Codio 融入工作流",
     ms:[["2026-12-14","開始調研"],["2027-01-08","給出時程"]], rep:null, last:{date:"2026-11-11", now:-1}},
    {name:"產品失效分析", type:"deliver", dri:"万峰、景棠", steps:WF, rel:"AI FA", relLong:"調研 AI FA 融入工作流",
     ms:[["2026-12-14","開始調研"],["2027-01-08","給出時程"]], rep:null, last:{date:"2026-11-11", now:-1}},
    {name:"LabMind 接入", type:"deliver", dri:null, steps:["架構研究","適配設計","資源評估與準備","正式串連測試","用戶 Try Run"],
     ms:[["2026-11-16","開始架構研究"],["2026-12-07","適配設計、資源評估與準備同時開始"],["2026-12-11","和 LabMind 團隊定案方案 A／B"],["2027-01-08","部署方案提案會"]],
     rep:null}
  ]},
  {name:"AI Hiring Agent", note:"已結案", reqs:[
    {name:"開放複用", type:"promo", dri:null, nums:["尋求單位","申請單位","已上線單位"], rep:null}
  ]},
  {name:"Mac Mini 部署試驗", reqs:[
    {name:"驗證兩台", type:"research", dri:null, q:"可穩定運行的模型上限", rep:null},
    {name:"驗證四台", type:"research", dri:null, q:"模型上限與 Hiring Agent 端到端結果", rel:"Hiring Agent", relLong:"以完整 AI Hiring Agent 驗證端到端", rep:null}
  ]},
  {name:"Codio 使用與活化", reqs:[
    {name:"工具腳本類開發", type:"promo", dri:null, rep:null},
    {name:"大型系統類開發", type:"promo", dri:null, rel:"Development Skill", relLong:"與 Development Skill 共用 InvestGo 需求驗證", rep:null},
    {name:"IDE 串接研究", type:"research", dri:null, q:"從 IDE 使用 Codio 與直接使用的差異", rep:null}
  ]},
  {name:"Nomi 使用與活化", reqs:[
    {name:"AAS 系統重構", type:"deliver", dri:null, steps:null, desc:"xTrack 重構為 Xylon", rep:null}
  ]},
  {name:"新 Skill 研究與建置", reqs:[
    {name:"Presentation Skill", type:"deliver", dri:null, steps:SKILL, scope:3, rel:"Nomi", relLong:"之後研究接上 Nomi", rep:null},
    {name:"Development Skill", type:"deliver", dri:null, steps:SKILL, scope:7, rel:"Codio", relLong:"由 Codio 執行，與大型系統類開發共用 InvestGo 需求驗證", rep:null}
  ]}
];

/* ===== 計算與呈現 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dn = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) / 864e5;
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
const BASE = dn(ASOF);
const REQS = PROJECTS.flatMap(p => p.reqs);
const reported = REQS.filter(r => r.rep);
const doneCount = reported.reduce((n, r) => n + (r.rep.done || []).length, 0);
const helps = reported.filter(r => r.rep.help).map(r => [r.name, r.rep.help]);

$("week").innerHTML = `本週 <b class="mono">${md(WEEK.from)}–${md(WEEK.to)}</b>　資料截至 <b class="mono">${md(ASOF)}</b>　${PROJECTS.length} 個項目・${REQS.length} 個需求`;
const stat = (c, n, label) => `<div class="stat" style="--c:var(${c})"><b>${n}</b><span>${label}</span></div>`;
$("stats").innerHTML = stat("--ok", doneCount, "本週完成事項") + stat(helps.length ? "--bad" : "--idle", helps.length, "需要副總支援") +
  stat("--accent", `${reported.length}<small style="font-size:.6em;color:var(--muted)">／${REQS.length}</small>`, "需求已回報");
$("headline").innerHTML = reported.length
  ? `本週 <b>${reported.length}</b> 個需求已回報，共完成 <b>${doneCount}</b> 件事${helps.length ? `，<b>${helps.length}</b> 件需要副總支援` : "，無需副總支援事項"}。`
  : `本週回報彙整中（<b>0／${REQS.length}</b> 個需求已回報）。下方先列出各需求最近一次的已知狀態與規劃里程碑。`;
if (helps.length) { $("help").hidden = false; $("help").innerHTML = `<span class="k">需要副總支援</span>` + helps.map(([n, t]) => `<span><b>${esc(n)}</b>：${esc(t)}</span>`).join(""); }

const nowSet = v => new Set([].concat(v ?? []));
function trackHTML(steps, now){
  const set = nowSet(now), max = Math.max(-1, ...set);
  return `<div class="track" aria-hidden="true">${steps.map((s, i) => `<i class="${set.has(i) ? "now" : i < max ? "done" : ""}" title="${esc(s)}"></i>`).join("")}</div>`;
}
const stepName = (steps, now) => [...nowSet(now)].filter(i => i >= 0).map(i => steps[i]).join("、");
const nextMs = ms => (ms || []).find(m => dn(m[0]) >= BASE);
const msHTML = ms => { const m = nextMs(ms); if (!m) return ""; const d = dn(m[0]) - BASE;
  return `<div class="ms">下一里程碑 <b class="mono">${md(m[0])}</b> ${esc(m[1])}<span class="dim">（${d === 0 ? "當天" : d + " 天後"}）</span></div>`; };

function progressHTML(r){
  const src = r.rep || r.last;
  if (r.type === "deliver") {
    if (!r.steps) return `<div class="pg"><span class="wait">待回報</span> <span class="dim">步驟待定</span></div>`;
    const now = src ? src.now : null;
    const started = now != null && [...nowSet(now)].some(i => i >= 0);
    const label = now == null ? `<span class="wait">待回報</span>`
      : started ? `目前 <b>${esc(stepName(r.steps, now))}</b>${r.rep ? "" : `<span class="dim">（${md(src.date)} 回報）</span>`}`
      : `<b>尚未開始</b>`;
    const when = src && !r.rep && now != null ? `<span class="dim">（${md(src.date)} 回報）</span>` : "";
    const text = src && src.subs ? src.subs.map(([n, i]) => `${esc(n)} <b>${i >= 0 ? esc(r.steps[i]) : "未開始"}</b>`).join("・") + when : label;
    const scope = r.scope ? `<span class="dim">　涵蓋 ${r.scope} 個階段</span>` : "";
    return `<div class="pgl">${trackHTML(r.steps, now ?? -1)}<div class="pg">${text}${scope}</div></div>` + msHTML(r.ms);
  }
  if (r.type === "research") {
    const c = r.rep && r.rep.conclusion;
    return `<div class="pg">結論：${c ? `<b>${esc(c)}</b>` : `<span class="wait">待回報</span>`}</div><div class="ms">要回答：${esc(r.q)}</div>`;
  }
  if (r.nums) return `<div class="nums">${r.nums.map(n => `<span>${esc(n)} <b>${r.rep && r.rep.nums && r.rep.nums[n] != null ? r.rep.nums[n] : "–"}</b></span>`).join("")}</div>`;
  return `<div class="pg dim">使用回饋由推廣平台統計系統提供</div>`;
}
const listHTML = (arr, cls) => arr && arr.length ? `<ul class="list ${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
function weekHTML(r){
  if (r.rep) return listHTML(r.rep.done, "done") || `<span class="dim">本週無完成事項</span>`;
  return `<span class="wait">待回報</span>${r.last && r.last.text ? `<span class="last"> 上次 ${md(r.last.date)}：${esc(r.last.text)}</span>` : ""}`;
}
const nextHTML = r => r.rep ? (listHTML(r.rep.next, "next") || `<span class="dim">—</span>`) : `<span class="dim">—</span>`;

$("board").innerHTML =
  `<div class="thead"><span>項目</span><div class="cols"><span>需求・DRI</span><span>進度</span><span>本週完成</span><span>下週要完成</span></div></div>` +
  PROJECTS.map(p => `<section class="proj"><div class="pname">${esc(p.name)}<small>${p.reqs.length} 個需求${p.note ? "・" + esc(p.note) : ""}</small></div><div>` +
    p.reqs.map(r => `<div class="req cols"${r.desc ? ` title="${esc(r.desc)}"` : ""}>
      <div class="rn">${esc(r.name)}<small>DRI：${esc(r.dri || "待補")}${r.rel ? `<span class="rel" title="${esc(r.relLong || r.rel)}">↔ ${esc(r.rel)}</span>` : ""}</small></div>
      <div>${progressHTML(r)}</div>
      <div>${weekHTML(r)}</div>
      <div>${nextHTML(r)}</div>
    </div>`).join("") + `</div></section>`).join("");
</script>
