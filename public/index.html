<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SW AI 推動全貌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面（依使用者 11-18 提供的參考圖）：
   第一行＝標題＋週次＋四個數字（細直線分隔，不加框）；
   第二行＝「本週成果」斜角標籤＋三則「主題｜成果」；第三行＝「請副總協助」淡色帶（有事項才出現）；
   下方三欄模塊卡（01 課題研究｜02 案例開發｜03 導入試用＋04 推廣複用），同一色系的深青綠標題列；
   模塊內依項目分小標題，需求以圓圈編號、細線分隔，每行「本週：」「下週：」「成果：」，沒內容的行省略。 */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --fg:#1B2724; --muted:#5E6B68; --line:#DCE4E1;
  --brand:#2E6B62; --brand-ink:#245850; --brand-soft:#E3F0EC; --on-brand:#FFFFFF;
  --idle:#5F6B68; --idle-soft:#ECF0EE; --badge:#E7ECEA; --warn:#A86200;
  --f-body:"Microsoft YaHei","微软雅黑","PingFang TC","PingFang SC","Noto Sans TC",system-ui,sans-serif;  /* 使用者指定微軟雅黑；Mac 用蘋方、其他系統用 Noto Sans TC */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#17211E; --fg:#E4ECE9; --muted:#9AA9A5; --line:#2A3834;
  --brand:#5FBFAE; --brand-ink:#7FD2C2; --brand-soft:#183531; --on-brand:#0F1614;
  --idle:#A7B4B0; --idle-soft:#222D2A; --badge:#25312D; --warn:#F0B055;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17211E; --fg:#E4ECE9; --muted:#9AA9A5; --line:#2A3834;
  --brand:#5FBFAE; --brand-ink:#7FD2C2; --brand-soft:#183531; --on-brand:#0F1614;
  --idle:#A7B4B0; --idle-soft:#222D2A; --badge:#25312D; --warn:#F0B055;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.page{max-width:1600px;margin:0 auto;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* 分頁 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs a{font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 13px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--brand)}
.tabs a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* 第一行：標題＋週次＋四個數字 */
.head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0}
.head h1{font-size:34px;font-weight:900;line-height:1.15;letter-spacing:.04em;padding-left:14px;border-left:5px solid var(--brand)}
.head .wk{font-size:20px;color:var(--muted);font-weight:500}
.head > .seg{display:flex;align-items:baseline;gap:8px;padding:0 22px;border-left:1px solid var(--line)}
.head > .seg:first-of-type{margin-left:18px}
.head .seg b{font-size:38px;font-weight:900;line-height:1;color:var(--brand)}
.head .seg span{font-size:16px;font-weight:700}

/* 第二行：本週成果 */
.wins{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:58px}
.wins .lab{background:var(--brand);color:var(--on-brand);font-size:18px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;padding:0 30px 0 18px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.wins ul{list-style:none;margin:0;padding:10px 8px;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));align-items:center}
.wins li{display:flex;align-items:baseline;gap:12px;padding:3px 20px;min-width:0;font-size:16px}
.wins li + li{border-left:1px solid var(--line)}
/* 4 則時排成兩欄兩列 */
.wcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;padding:6px 0}
.wcols ul{display:flex;flex-direction:column;align-items:stretch;padding:0 8px}
.wcols ul + ul{border-left:1px solid var(--line)}
.wcols li{border-left:0!important;padding-block:4px}
.wcols li + li{border-top:1px solid var(--line)}
.wins li b{color:var(--brand);font-size:17.5px;font-weight:900;white-space:nowrap;padding-right:10px;border-right:1px solid var(--line)}
.wins li span{min-width:0}
.wins .empty{padding:0 18px;color:var(--muted);align-self:center}

/* 第三行：請副總協助 */
.ask{display:flex;align-items:baseline;gap:14px;background:var(--brand-soft);border-radius:10px;padding:13px 22px;font-size:16px}
.ask b{color:var(--brand-ink);font-size:18px;font-weight:900;letter-spacing:.04em;white-space:nowrap;padding-right:14px;border-right:1px solid var(--line)}
.ask div + div{margin-top:2px}

/* 模塊卡：三欄，第三欄上下疊放 03、04 */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;flex:1 1 auto}
/* 三欄底部切齊：較矮的欄把多出的高度平均分給各需求，需求內容在自己的格內垂直置中 */
.mbody{flex:1 1 auto;display:flex;flex-direction:column}
.mbody > .proj{flex:none}
.mbody > .req{flex:1 1 auto;align-content:center}
.mod > header{display:flex;align-items:baseline;gap:12px;background:var(--brand);color:var(--on-brand);padding:7px 16px}
.mod h3{font-size:19px;font-weight:900;letter-spacing:.06em}
.mod h3 .no{margin-right:10px}
.mod > header span{margin-left:auto;font-size:14px;font-weight:700}
.mbody{padding:2px 16px 6px}
.proj{font-size:15px;font-weight:900;color:var(--brand-ink);padding:6px 0 4px;border-bottom:1px solid var(--line)}
.req{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:0 10px;padding:7px 0 8px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .i{grid-row:1 / span 4;width:24px;height:24px;border-radius:50%;background:var(--badge);color:var(--fg);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.req h4{font-size:16px;font-weight:900;line-height:1.4}
.pill{font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:6px;white-space:nowrap;color:var(--brand-ink);background:var(--brand-soft);align-self:start;margin-top:2px}
.pill.idle{color:var(--idle);background:var(--idle-soft)}
.ln{grid-column:2 / -1;font-size:13.5px;line-height:1.5}
.ln b{font-weight:700}
.ln.last{color:var(--muted)}
.ln.issue b{color:var(--warn)}
.ln.next{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

footer{font-size:11.5px;color:var(--muted)}
footer a{color:var(--brand-ink)}

/* 矮螢幕（如筆電 1440×900）再壓縮，維持單屏 */
/* 一頁不滾動的自動調整（由下方程式依實際高度決定）：
   預設＝寬鬆；超出一屏時 fit1＝模塊區緊湊、上方仍寬鬆；仍超出時 fit2＝全部緊湊 */
html.fit1 .page{gap:12px}
html.fit1 .board,html.fit1 .col{gap:10px}
html.fit1 .mod > header{padding:5px 14px}
html.fit1 .mod h3{font-size:17px}
html.fit1 .mbody{padding:0 14px 4px}
html.fit1 .proj{font-size:14px;padding:4px 0 3px}
html.fit1 .req{padding:4px 0 5px}
html.fit1 .req h4{font-size:15px}
html.fit1 .ln{font-size:13px;line-height:1.42}
html.fit2 .board,html.fit2 .col{gap:10px}
html.fit2 .mod > header{padding:5px 14px}
html.fit2 .mod h3{font-size:17px}
html.fit2 .mbody{padding:0 14px 4px}
html.fit2 .proj{font-size:14px;padding:4px 0 3px}
html.fit2 .req{padding:4px 0 5px}
html.fit2 .req h4{font-size:15px}
html.fit2 .ln{font-size:13px;line-height:1.42}
html.fit2 .wins ul{padding:4px 8px}
html.fit2 .wins li{font-size:13px;line-height:1.35;padding-top:1px;padding-bottom:1px}
html.fit2 .wins li b{font-size:14px}
html.fit2 .wcols{padding:3px 0}
html.fit2 .wcols li{padding-block:1px}
html.fit2 .wcols{padding:2px 0}
html.fit2 .page{gap:9px;padding-block:6px 8px}
html.fit2 .head h1{font-size:27px}
html.fit2 .head .seg b{font-size:28px}
html.fit2 .head .wk{font-size:17px}
html.fit2 .wins{min-height:38px}
html.fit2 .wins .lab{font-size:15.5px}
html.fit2 .wins li{font-size:14px}
html.fit2 .wins li b{font-size:15px}
html.fit2 .ask{padding:6px 18px;font-size:14.5px}
html.fit2 .ask b{font-size:15.5px}

/* 平板：兩欄；手機：一欄 */
@media (max-width:1100px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wins{grid-template-columns:1fr}
  .wins .lab{clip-path:none;padding:6px 18px}
  .wins ul{grid-template-columns:1fr}
  .wins li + li{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:700px){
  .board{grid-template-columns:1fr}
  .head > .seg{padding:0 14px}
  .head > .seg:first-of-type{margin-left:0;border-left:0;padding-left:0}
  .head .wk{flex-basis:100%;padding-left:19px}
  .ask{flex-direction:column;gap:4px}
  .ask b{border-right:0;padding-right:0}
}
</style>
</head>
<body>
<div class="page">
  <nav class="tabs" aria-label="頁面"><a href="./" aria-current="page">總覽</a><a href="daily.html">每日進度</a><a href="arch.html">架構全貌</a></nav>
  <header class="head" id="head"></header>
  <section class="wins" aria-label="本週成果"><div class="lab">本週成果</div><div id="wins"></div></section>
  <section class="ask" id="ask" aria-label="請副總協助" hidden></section>
  <main class="board" id="board" aria-label="四大模塊"></main>
  <footer id="foot"></footer>
</div>
<script>
/* ===== 資料（每週由 PM 依負責人訊息回覆更新） =====
   WEEK：本週週次；ASOF：資料截至（手動設定，頁面所有時間計算以它為準，不隨瀏覽當天變動）。
   MODULES：四大模塊，依成熟度路線排列；col＝第幾欄（0–2）。需求依 proj（項目）分小組。
   需求欄位：
     type   deliver＝交付型（照步驟做出東西）／research＝研究型（回答問題）／promo＝推廣型（讓更多人用）
     steps  交付型的時程步驟（短名稱）；null＝步驟待定
     start  尚未開始時的預計開始日
     sub    某個步驟底下的子階段 {at:步驟索引, items:[...]}（例：Skill 的「建置」含技能本身的各階段）
     ms     PM 規劃的里程碑 [日期, 名稱]
     rel    與其他需求的關聯
     nums   推廣型要問的數字名稱
     rep    本週回報：{now:步驟索引或索引陣列（-1＝尚未開始）, subDone:子階段完成數, subs:[[子項,步驟索引]],
                       pill:"狀態標籤文字（選填，覆寫自動判斷）", hideDone:true＝卡片不顯示本週（內容已在成果，只用於本週成果與統計）, issue:"遇到的問題（不需副總幫忙；不算本週進度）", done:[...], next:[...], hl:[放進「本週成果」的完成事項：索引，或 {i:索引, s:主題, t:短句, o:顯示順序}], help:"", conclusion:"", nums:{...}}；null＝待回報
     last   最近一次的已知狀態（本週尚未回報時顯示）：{date, now, subs, text} */
const WEEK = {from:"2026-11-13", to:"2026-11-19"};  /* 週次：週五到隔週四 */
const ASOF = "2026-11-18";

const WF = ["設計規劃","節點開發","首次跑通","五次跑通","用戶驗收","上線"];
const SKILL = ["市場調研","技能設計","建置","實測驗證","推廣接入"];

const MODULES = [
  {no:"①", name:"課題研究", col:0, reqs:[
    {proj:"Mac Mini 部署試驗", name:"驗證兩台", type:"research", dri:"萬鋒", q:"可穩定運行的模型上限", rel:"跑 Lab Collab Mate 工作流",
     desc:"硬體：Mac mini 24G × 2，雷靂 5 全互聯。已部署 Qwen3.6 35B A3B（4-bit），進入部署後運維：有 bug 且影響運行中的項目才 debug。",
     rep:{pill:"運維中", conclusion:"可部署 Qwen3.6 35B 並正常對話；只能跑自定義輕量 Agent，接 3 個工具執行 Lab Collab Mate 工作流"}},
    {proj:"Mac Mini 部署試驗", name:"驗證四台", type:"research", dri:"萬鋒", q:"模型上限與 Hiring Agent 端到端結果", rel:"以 AI Hiring Agent 驗證",
     desc:"硬體：Mac mini 24G × 4，雷靂 5 全互聯。已部署 Qwen3.6 35B A3B（4-bit），進入部署後運維。記憶體：只跑模型單機 13G；跑 AI Hiring Agent 單機 26G（超過實體 24G，會用到 Swap）。",
     rep:{pill:"運維中", conclusion:"可部署 Qwen3.6 35B 並正常對話；可跑 Hermes 架構的 AI Hiring Agent",
          issue:"發現閒置一段時間後系統會重啟，疑似作業系統問題", next:["持續排查重啟問題（TBD）"]}},
    {proj:"Codio 使用與活化", name:"IDE 串接研究", type:"research", dri:"Neo", q:"從 IDE 使用 Codio 與直接使用的差異",
     desc:"比較 Codio 的 IDE 插件與原生 TUI：插件在上手、多會話、閱讀輸出、選中代碼、引用檔案、跳回代碼都較直覺；TUI 把操作留在鍵盤上。產出 IDE 插件安裝 SOP（5 步）。11/16 結案，沒有規劃下一步。",
     rep:{pill:"11/16 結案", conclusion:"IDE 插件體驗較佳：選中代碼自動引用、Diff 一鍵跳轉、多標籤並行；已產出插件安裝 SOP",
          done:["完成 IDE 插件與原生 TUI 體驗比較，產出插件安裝 SOP，11/16 結案"], hideDone:true,
          hl:[{i:0, o:6, s:"IDE 串接研究", t:"完成 IDE 插件與原生 TUI 比較，產出安裝 SOP，11/16 結案"}]}},
    {proj:"新 Skill 研究與建置", name:"Presentation Skill", type:"deliver", dri:"Alyanna", steps:SKILL, rel:"之後接上 Nomi",
     sub:{at:2, items:["目標／對象／架構／內容梳理","風格與排版","品管與檢查驗證"]},
     desc:"技能名 deck-architect（從頭到尾支援簡報全流程的 Skill）。進度來源：claude-base-skills repo 的 presentation-skill-generation 分支。目前在技能設計：方法論已用 4 份真實簡報驗證，正在做設計美感的風格定調；尚未用真實簡報從頭做到成品。",
     rep:{now:1,
          done:["完成 12 款風格意象圖（插畫、積木、水彩可切換畫風）", "依審閱回饋重做顧問報告、週報、攝影雜誌三款"],
          next:["討論 12 款並選出首批 3 款，進入逐風格設計排法"],
          hl:[{i:0, o:5, s:"Presentation Skill", t:"完成簡報架構梳理技能，產出 12 款風格意象圖"}]}},
    {proj:"新 Skill 研究與建置", name:"Development Skill", type:"deliver", dri:"Lucas", steps:SKILL, rel:"由 Codio 執行，InvestGo、PCC 驗證",
     sub:{at:2, items:["需求梳理","SRS","原型設計","開發設計文檔","程式碼生成校正","上線運維","測試用例生成"]},
     desc:"以 InvestGo 部門 IDL 資訊更新看板、PCC 人力活化系統兩個需求實測，與 Codio 的兩個案例共用驗證。",
     rep:{now:3,
          done:["以 InvestGo 實測：依 SRS 自動生成開發設計文檔", "以 PCC 實測：依需求自動生成看板 UI 設計"],
          next:["InvestGo 測程式碼生成；PCC 依定稿 UI 生成 SRS"]}}
  ]},
  {no:"②", name:"案例開發", col:1, reqs:[
    {proj:"Lab Collab Mate", name:"客戶軟體驗證", type:"deliver", dri:"Simon、Gary、景棠、熙宁", steps:WF,
     ms:[["2026-11-24","Bundle 首次跑通"],["2026-11-25","proxima 自動化節點開發完成"],["2026-12-01","Bundle 五次跑通"],["2026-12-11","正式上線（proxima、EFI 首次跑通 TBD）"]],
     rep:{now:1, subs:[["Bundle",1],["proxima",1],["EFI",1]],
          done:["Bundle 串聯 4 個節點，可跑通查看、下載新 bundle 與刷機", "Bundle 累計 9 個、proxima 6 個、EFI 1 個自動化節點"],
          hl:[{i:0, s:"Lab Collab Mate", t:"Bundle 串聯 4 個節點，查看、下載新 bundle 與刷機已能跑通", o:1}],
          issue:"proxima、EFI 首次跑通時間 TBD（EFI 因支援客戶 STFL 轉 burn-in 延緩）",
          next:["Bundle 本週串接完成，下週二（11/24）首次跑通全流程"]}},
    {proj:"Lab Collab Mate", name:"產品 Panic 處理", type:"deliver", dri:"Simon、Gary、熙宁", steps:WF, start:"2026-12-01",
     ms:[["2026-11-27","串口方案定案"],["2026-12-01","開始工具開發與串連"],["2026-12-11","首次跑通"],["2026-12-18","五次跑通"],["2027-01-08","正式上線"]],
     rep:null, last:{date:"2026-11-11", now:-1}},
    {proj:"Lab Collab Mate", name:"產品測試軟體開發", type:"deliver", dri:"熙宁", steps:WF, start:"2026-12-14", rel:"調研 Codio 融入工作流",
     ms:[["2026-12-14","開始調研"],["2027-01-08","給出時程"]], rep:null, last:{date:"2026-11-11", now:-1}},
    {proj:"Lab Collab Mate", name:"產品失效分析", type:"deliver", dri:"萬鋒、景棠", steps:WF, start:"2026-12-14", rel:"調研 AI FA 融入工作流",
     ms:[["2026-12-14","開始調研"],["2027-01-08","給出時程"]], rep:null, last:{date:"2026-11-11", now:-1}},
    {proj:"Lab Collab Mate", name:"LabMind 接入", type:"deliver", dri:null, steps:["架構研究","適配設計","資源評估與準備","正式串連測試","用戶 Try Run"],
     ms:[["2026-11-16","開始架構研究"],["2026-12-07","適配設計、資源評估與準備同時開始"],["2026-12-11","和 LabMind 團隊定案方案 A／B"],["2027-01-08","部署方案提案會"]],
     rep:null}
  ]},
  {no:"③", name:"導入試用", col:2, reqs:[
    {proj:"Codio 使用與活化", name:"InvestGo IDL 資訊更新看板", type:"promo", dri:"Lucas", rel:"與 Development Skill 共用 InvestGo 驗證",
     desc:"大型系統類開發：以 InvestGo 部門 IDL 資訊更新看板需求為試點，用 Codio 搭配開發 Skill 走開發流程。",
     rep:{done:["用 Codio 搭配開發設計文檔生成 Skill，依 SRS 自動生成開發設計文檔（技能實測驗證中）"],
          next:["結合 Vibe Coding Skill，開展程式碼生成測試"],
          hl:[{i:0, o:4, s:"InvestGo、PCC", t:"Codio 搭配 Development Skill，自動產出開發設計文檔與看板 UI 設計"}]}},
    {proj:"Codio 使用與活化", name:"PCC 人力活化系統", type:"promo", dri:"Lucas", rel:"與 Development Skill 共用驗證",
     desc:"大型系統類開發：以 PCC 人力活化系統需求為試點，用 Codio 搭配開發 Skill 走開發流程。",
     rep:{done:["用 Codio 搭配原型生成 Skill，依需求自動生成看板 UI 設計（技能實測驗證中）"],
          next:["依定稿的 UI 設計生成對應的 SRS"]}},
    {proj:"Nomi 使用與活化", name:"AAS 系統重構", type:"deliver", dri:"Tylee",
     steps:["系統分析","需求梳理","原型確認","技術規劃","AI 開發測試","內部試用驗收","用戶單位確認","Xylon 架構重構"],
     desc:"架構演進：原本建在 xTrack 系統管理架構 → Nomi 重構後為純 JSP（無系統管理架構）→ 下一階段改為 Xylon 系統管理架構。重構範圍止於驗收，不含正式部署與切換。用 Nomi 經 6 輪迭代（10/21–11/13），驗收 4 次退回後通過。",
     rep:{now:5, pill:"內部驗收完成",
          done:["用 Nomi 走完系統重構全流程，內部測試驗收完成"],
          next:["跟用戶單位確認功能是否符合業務需求（TBD）"],
          hl:[{i:0, o:3, s:"AAS 系統重構", t:"用 Nomi 走完系統重構全流程，內部測試驗收完成"}]}}
  ]},
  {no:"④", name:"推廣複用", col:2, reqs:[
    {proj:"AI Hiring Agent", name:"開放複用", type:"promo", dri:"Alyanna", nums:["尋求","申請","已上線"], numUnit:"單位",
     rep:{nums:{"尋求":2, "申請":0, "已上線":0},
          done:["PCC、Non Phone OPM 派人了解，已提供操作影片與部署準備簡報"],
          next:["待需求單位確認導入需求，並準備部署的硬體與模型"],
          hl:[{i:0, o:2, s:"AI Hiring Agent", t:"PCC、Non Phone OPM 來了解，已提供操作影片與部署準備簡報"}]}},
    {proj:"Codio 使用與活化", name:"工具腳本類開發", type:"promo", dri:null, rep:null}
  ]}
];

/* ===== 計算與呈現 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dn = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) / 864e5;
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
const BASE = dn(ASOF);
const REQS = MODULES.flatMap(m => m.reqs);
const reported = REQS.filter(r => r.rep);
const helps = reported.filter(r => r.rep.help);
const hasDone = r => r.rep && (r.rep.done || []).length > 0;
const progressed = REQS.filter(hasDone).length;
const projCount = new Set(REQS.map(r => r.proj)).size;

/* 第一行：標題＋週次＋四個數字 */
const seg = (n, t) => `<div class="seg"><b class="num">${n}</b><span>${t}</span></div>`;
$("head").innerHTML = `<h1>本週進度</h1><span class="wk num">｜ ${md(WEEK.from)}–${md(WEEK.to)}</span>` +
  seg(projCount, "項目") + seg(REQS.length, "需求") + seg(progressed, "本週有進度") + seg(helps.length, "待協調");

/* 第二行：本週成果「主題｜成果」。回報的 hl 可寫 {i:完成事項索引, s:主題, t:短句}；只寫索引時，主題用需求名、內容用完成事項原文。最多 6 則 */
let wins = reported.flatMap(r => (r.rep.hl || []).map(h => typeof h === "number"
  ? {s:r.name, t:r.rep.done[h]} : {s:h.s || r.name, t:h.t || r.rep.done[h.i], o:h.o ?? 99}));
wins.sort((a, b) => (a.o ?? 99) - (b.o ?? 99));  /* hl 的 o＝顯示順序（依重要性，PM 決定） */
if (!wins.length) wins = reported.filter(hasDone).map(r => ({s:r.name, t:r.rep.done[0]}));
wins = wins.slice(0, 6);
$("wins").innerHTML = wins.length
  ? (() => { const n = wins.length, c = n <= 3 ? n : 2;  /* 1–3 則一排；4 則以上兩欄 */
      const li = w => `<li><b>${esc(w.s)}</b><span>${esc(w.t)}</span></li>`;
      if (n <= 3) return `<ul style="--n:${c}">${wins.map(li).join("")}</ul>`;
      const h = Math.ceil(n / 2);  /* 4 則以上：左右兩欄各自由上往下排 */
      return `<div class="wcols"><ul>${wins.slice(0, h).map(li).join("")}</ul><ul>${wins.slice(h).map(li).join("")}</ul></div>`; })()
  : `<div class="empty">本週回報彙整中；負責人回覆後，這裡會列出本週最重要的成果。</div>`;

/* 第三行：請副總協助（有事項才出現） */
if (helps.length) { $("ask").hidden = false; $("ask").innerHTML = `<b>請副總協助</b><div>${helps.map(r => `<div>${esc(r.rep.help)}<span class="num" style="color:var(--muted)">（${esc(r.name)}）</span></div>`).join("")}</div>`; }

/* 狀態標籤 */
const nowSet = v => new Set([].concat(v ?? []));
function pill(r){
  const src = r.rep || r.last;
  if (r.rep && r.rep.pill) return ["", r.rep.pill];
  if (r.type === "deliver") {
    if (!r.steps) return ["idle", r.rep ? "步驟待定" : "待回報"];
    const now = src ? src.now : null;
    if (now == null) return ["idle", "待回報"];
    const set = nowSet(now), max = Math.max(...set);
    if (max < 0) return ["idle", r.start ? `預計 ${md(r.start)} 開始` : "尚未開始"];
    if (r.sub && max === r.sub.at) return ["", `完成 ${src.subDone || 0}/${r.sub.items.length} 子階段`];
    return ["", r.steps[max]];
  }
  if (r.type === "research") return r.rep ? ["", r.rep.conclusion ? "已有結論" : "測試中"] : ["idle", "待回報"];
  if (r.nums) return r.rep && r.rep.nums ? ["", r.nums.map(n => `${n} ${r.rep.nums[n] ?? "–"}`).join("・")] : ["idle", "待回報"];
  return r.rep ? ["", "推廣中"] : ["idle", "待回報"];
}
/* 滑鼠提示：DRI、關聯、步驟、子項狀態、下一里程碑 */
function tip(r){
  const src = r.rep || r.last, t = [`DRI：${r.dri || "待補"}`];
  if (r.rel) t.push(`關聯：${r.rel}`);
  if (r.steps) t.push(`步驟：${r.steps.join(" → ")}`);
  if (r.sub) t.push(`${r.steps[r.sub.at]}的子階段：${r.sub.items.join("、")}`);
  if (src && src.subs) t.push(src.subs.map(([n, i]) => `${n}：${i >= 0 ? r.steps[i] : "未開始"}`).join("；") + (r.rep ? "" : `（${md(src.date)} 回報）`));
  const m = (r.ms || []).find(x => dn(x[0]) >= BASE); if (m) t.push(`下一里程碑：${md(m[0])} ${m[1]}`);
  if (r.type === "research") t.push(`要回答：${r.q}`);
  if (r.desc) t.push(r.desc);
  return t.join("\n");
}
const more = arr => arr.length > 1 ? `等 ${arr.length} 件` : "";
function reqHTML(r, i){
  const [cls, word] = pill(r);
  let rows = "";
  if (r.rep) {
    if (r.rep.conclusion) rows += `<div class="ln"><b>成果：</b>${esc(r.rep.conclusion)}</div>`;
    const d = r.rep.done || [], n = r.rep.next || [];
    if (d.length && !r.rep.hideDone) rows += `<div class="ln"><b>本週：</b>${esc(d[0])}${more(d)}</div>`;
    if (r.rep.issue) rows += `<div class="ln issue"><b>問題：</b>${esc(r.rep.issue)}</div>`;
    if (n.length) rows += `<div class="ln next" title="下週：${esc(n.join("；"))}"><b>下週：</b>${esc(n[0])}${more(n)}</div>`;
  } else if (r.last && r.last.text) {
    rows += `<div class="ln last"><b>上次（${md(r.last.date)}）：</b>${esc(r.last.text)}</div>`;
  }
  return `<div class="req" title="${esc(tip(r))}"><span class="i num">${i}</span><h4>${esc(r.name)}</h4><span class="pill ${cls}">${esc(word)}</span>${rows}</div>`;
}
function modHTML(m, k){
  let html = "", proj = null;
  m.reqs.forEach((r, i) => { if (r.proj !== proj) { proj = r.proj; html += `<h4 class="proj">${esc(proj)}</h4>`; } html += reqHTML(r, i + 1); });
  return `<section class="mod"><header><h3><span class="no num">${String(k + 1).padStart(2, "0")}</span>${esc(m.name)}</h3><span>${m.reqs.length} 個需求</span></header><div class="mbody">${html}</div></section>`;
}
$("board").innerHTML = [0, 1, 2].map(c => `<div class="col">${MODULES.map((m, k) => m.col === c ? modHTML(m, k) : "").join("")}</div>`).join("");
$("foot").innerHTML = `資料截至 ${md(ASOF)}・已回報 ${reported.length}／${REQS.length}。進度以負責人最近一次回報為準；日期為 PM 規劃的時程。滑鼠移到需求上可看 DRI、步驟、下一里程碑等細節；Lab Collab Mate 的工作流細節見 <a href="daily.html">每日進度</a>。`;

/* 一頁不滾動：桌機依實際高度逐級收緊（寬鬆 → fit1 → fit2）；字型載入完成與視窗大小改變時重算 */
function fit(){
  const el = document.documentElement;
  el.classList.remove("fit1", "fit2");
  if (innerWidth <= 900) return;
  for (const c of ["fit1", "fit2"]) { if (el.scrollHeight <= innerHeight) break; el.classList.remove("fit1", "fit2"); el.classList.add(c); }
}
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
let fitT; addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(fit, 100); });
</script>
</body>
