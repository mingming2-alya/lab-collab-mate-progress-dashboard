<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SW AI 推動全貌</title>
<style>
/* 總覽（給副總）：一頁不滾動，一眼看清單位本週動作。
   閱讀順序：標題 → 左欄四個數字／右欄本週亮點 → 四大模塊。
   四大模塊依成熟度路線排列：① 課題研究 → ② 案例開發 → ③ 導入試用 → ④ 推廣複用；每個模塊用實心標題列分界。
   每個需求只留三樣：名稱＋狀態標籤、本週、下週（研究型多一行結論）；DRI、關聯、下一里程碑、子項狀態放在滑鼠提示。
   沿用每日進度頁的設計 token（同配色、字體、狀態語意）。 */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --fg:#18212B; --muted:#5D6B7A; --line:#DCE2E8; --seg:#D3DAE1;
  --accent:#1E5A86; --accent-soft:#E3EDF5; --on-accent:#FFFFFF;
  --ok:#1F7A4D; --ok-soft:#E2F2E9; --warn:#A86200; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE4E2;
  --idle:#66727F; --idle-soft:#E8ECF0; --new:#6A3FB5; --new-soft:#EEE6FA;
  --panel:#E9EEF3;
  --f-display:"Noto Serif TC","Noto Serif CJK TC","Songti TC","Songti SC","STSong","PMingLiU","SimSun",serif;
  --f-body:"PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19212A; --fg:#E6ECF1; --muted:#97A5B3; --line:#2B3642; --seg:#33404D;
  --accent:#7FB6E0; --accent-soft:#1D3243; --on-accent:#0E1A24;
  --ok:#5CC48C; --ok-soft:#173527; --warn:#F0B055; --warn-soft:#3A2A12; --bad:#F2857C; --bad-soft:#3E1D1B;
  --idle:#A3B0BD; --idle-soft:#26303A; --new:#C3A6F2; --new-soft:#2E2442;
  --panel:#0C1116;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19212A; --fg:#E6ECF1; --muted:#97A5B3; --line:#2B3642; --seg:#33404D;
  --accent:#7FB6E0; --accent-soft:#1D3243; --on-accent:#0E1A24;
  --ok:#5CC48C; --ok-soft:#173527; --warn:#F0B055; --warn-soft:#3A2A12; --bad:#F2857C; --bad-soft:#3E1D1B;
  --idle:#A3B0BD; --idle-soft:#26303A; --new:#C3A6F2; --new-soft:#2E2442;
  --panel:#0C1116;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.page{max-width:1600px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 14px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}

/* 分頁 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs a{font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 13px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* 標題列 */
.titlebar{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 20px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-display);font-size:26px;line-height:1.2;font-weight:700}
h1 .mono{font-family:var(--f-mono);font-size:.62em;color:var(--muted);font-weight:400;margin-left:10px}
.asof{font-size:12.5px;color:var(--muted)}

/* 頂部一列：左＝四個數字（項目數、需求數、本週有進度的需求數；需要副總幫忙，直接寫出是什麼事），右＝本週亮點。已回報數只放在右上小字給 PM 看 */
.top{display:grid;grid-template-columns:minmax(380px,30%) minmax(0,1fr);gap:12px;align-items:stretch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto 1fr;gap:10px}
.kpi{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:8px 12px;min-width:0}
.kpi > b{font-family:var(--f-mono);font-size:30px;line-height:1;color:var(--c);flex:none}
.kpi .t{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.35}
.kpi.help{grid-column:1 / -1;flex-wrap:wrap;row-gap:4px;align-content:flex-start;padding:8px 16px;gap:12px}
.kpi.help .d{flex-basis:100%;font-size:14px;line-height:1.45;border-top:1px solid var(--line);padding-top:5px}

/* 本週亮點：「項目・需求：進度亮點」，一行寫不完換第二行，不截斷 */
.hl{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:9px 16px 10px;min-width:0}
.hl h2{font-size:13px;letter-spacing:.08em;color:var(--ok);font-weight:700;margin-bottom:6px}
.hl ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 28px}
.hl li{font-size:16px;font-weight:700;line-height:1.45;padding-left:24px;position:relative}
.hl li::before{content:"✓";position:absolute;left:0;color:var(--ok)}
.hl li .p{color:var(--accent)}
.hl .empty{font-size:14px;color:var(--muted)}

/* 四大模塊：三欄，第三欄上下疊放 ③ ④；每個模塊＝實心標題列＋淺底面板，需求是面板上的白色區塊 */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod > header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent)}
.mod h3{font-size:17px;font-weight:700;letter-spacing:.02em}
.mod h3 .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--on-accent);color:var(--accent);font-size:13px;margin-right:8px;vertical-align:1px}
.mod > header span{font-size:12.5px;margin-left:auto;white-space:nowrap;opacity:.9}
.mbody{padding:8px;display:flex;flex-direction:column;gap:6px}
.proj{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:2px 4px 0}

/* 需求：名稱＋狀態、本週、下週（研究型多一行結論） */
.req{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px 7px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rh{display:flex;align-items:center;gap:10px;min-width:0}
.rn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap;color:var(--accent);background:var(--accent-soft)}
.pill.idle{color:var(--idle);background:var(--idle-soft)}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.ln{font-size:13.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .k{display:inline-block;width:2.6em;font-weight:700}
.ln.done .k{color:var(--ok)}
.ln.next{color:var(--muted)}
.ln.next .k{color:var(--accent)}
.ln.concl .k{color:var(--new)}
.ln.concl{font-weight:700}
.ln small{color:var(--muted);margin-left:4px;font-weight:400}

footer{font-size:11.5px;color:var(--muted);display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center}
footer a{color:var(--accent)}

/* 矮螢幕（如筆電 1440×900）再壓縮，維持單屏 */
@media (min-width:901px) and (max-height:960px){
  .page{gap:9px;padding-block:6px 8px}
  h1{font-size:22px}
  .kpi{padding:5px 12px}
  .kpi > b{font-size:24px}
  .hl{padding:6px 16px 6px}
  .hl h2{margin-bottom:4px}
  .hl li{font-size:15px;line-height:1.35}
  .hl ul{gap:4px 24px}
  .hl h2{margin-bottom:3px}
  .board,.col{gap:12px}
  .mod > header{padding:6px 14px}
  .mbody{padding:6px;gap:5px}
  .req{padding:4px 12px 5px;gap:1px}
}

/* 平板：兩欄；手機：一欄 */
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.top{grid-template-columns:1fr}}
@media (max-width:760px){
  .board{grid-template-columns:1fr}
  .hl ul{grid-template-columns:1fr}
  .ln{white-space:normal}
}

/* ===== 風格 B｜現代卡片（使用者 11-18 選定）：淺陰影、圓角，四個模塊各一種顏色 =====
   模塊色依路線：① 紫 ② 藍 ③ 綠松 ④ 橘；*s＝同色淡底。三個主題區塊都定義，深色模式用較亮的模塊色與深色淡底。 */
:root{--bg:#F4F5F9;--panel:#FFFFFF;--line:#E8EAF0;
  --m1:#6D4AE8;--m1s:#F0ECFD;--m2:#2563EB;--m2s:#E8F0FE;--m3:#0E8A84;--m3s:#E3F5F3;--m4:#C2410C;--m4s:#FDEEE6;--on-m:#FFFFFF;
  --sh1:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.05);--sh2:0 1px 2px rgba(20,30,60,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F141C;--panel:#18202B;--line:#2A3443;
  --m1:#A996F7;--m1s:#221D3F;--m2:#74A7F5;--m2s:#16253C;--m3:#4CC4B4;--m3s:#112D2A;--m4:#F2A06A;--m4s:#382315;--on-m:#0F141C;
  --sh1:0 1px 3px rgba(0,0,0,.35);--sh2:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0F141C;--panel:#18202B;--line:#2A3443;
  --m1:#A996F7;--m1s:#221D3F;--m2:#74A7F5;--m2s:#16253C;--m3:#4CC4B4;--m3s:#112D2A;--m4:#F2A06A;--m4s:#382315;--on-m:#0F141C;
  --sh1:0 1px 3px rgba(0,0,0,.35);--sh2:0 1px 2px rgba(0,0,0,.3)}
body{background:var(--bg)}
.kpi,.hl{border:0;box-shadow:var(--sh1);border-radius:14px}
.kpi{border-left:0;border-top:4px solid var(--c)}
.hl{border-left:0;border-top:4px solid var(--ok)}
.board{gap:16px}
.col{gap:16px}
.mod{border:0;border-radius:16px;box-shadow:var(--sh1)}
.mod > header{background:var(--mc);color:var(--on-m)}
.mod h3 .no{background:var(--on-m);color:var(--mc)}
.mod[data-m="1"]{--mc:var(--m1);--ms:var(--m1s)}
.mod[data-m="2"]{--mc:var(--m2);--ms:var(--m2s)}
.mod[data-m="3"]{--mc:var(--m3);--ms:var(--m3s)}
.mod[data-m="4"]{--mc:var(--m4);--ms:var(--m4s)}
.mbody{background:var(--ms);padding:10px;gap:8px}
.proj{color:var(--mc)}
.req{border:0;border-radius:10px;box-shadow:var(--sh2)}
.pill{color:var(--mc);background:var(--ms)}
.pill.idle{color:var(--idle);background:var(--idle-soft)}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.hl li .p{color:var(--m2)}
@media (min-width:901px) and (max-height:960px){
  .board,.col{gap:12px}
  .mbody{padding:7px;gap:6px}
  .mod > header{padding:5px 14px}
}
</style>
</head>
<body>
<div class="page">
  <nav class="tabs" aria-label="頁面"><a href="./" aria-current="page">總覽</a><a href="daily.html">每日進度</a><a href="arch.html">架構全貌</a></nav>
  <div class="titlebar">
    <div><div class="eyebrow">SW ・ AI 推動全貌</div><h1 id="h1">本週進度</h1></div>
    <div class="asof" id="asof"></div>
  </div>
  <div class="top">
    <div class="kpis" id="kpis"></div>
    <section class="hl" aria-labelledby="hlh"><h2 id="hlh">本週亮點</h2><div id="hl"></div></section>
  </div>
  <main class="board" id="board" aria-label="四大模塊"></main>
  <footer>
    <span>進度以負責人最近一次回報為準；日期為 PM 規劃的時程。滑鼠移到需求上可看 DRI、步驟、下一里程碑等細節；Lab Collab Mate 的工作流細節見 <a href="daily.html">每日進度</a>。</span>
  </footer>
</div>
<script>
/* ===== 資料（每週由 PM 依負責人訊息回覆更新） =====
   WEEK：本週週次；ASOF：資料截至（手動設定，頁面所有時間計算以它為準，不隨瀏覽當天變動）。
   MODULES：四大模塊，依成熟度路線排列；col＝第幾欄（0–2）。需求依 proj（項目）分小組。
   需求欄位：
     type   deliver＝交付型（照步驟做出東西）／research＝研究型（回答問題）／promo＝推廣型（讓更多人用）
     steps  交付型的時程步驟（短名稱）；null＝步驟待定
     start  尚未開始時的預計開始日
     sub    某個步驟底下的子階段 {at:步驟索引, items:[...]}（例：Skill 的「建置」含技能本身的各階段）
     ms     PM 規劃的里程碑 [日期, 名稱]
     rel    與其他需求的關聯
     nums   推廣型要問的數字名稱
     rep    本週回報：{now:步驟索引或索引陣列（-1＝尚未開始）, subDone:子階段完成數, subs:[[子項,步驟索引]],
                       done:[...], next:[...], hl:[done 裡要放進「本週亮點」的索引], help:"", conclusion:"", nums:{...}}；null＝待回報
     last   最近一次的已知狀態（本週尚未回報時顯示）：{date, now, subs, text} */
const WEEK = {from:"2026-11-17", to:"2026-11-23"};
const ASOF = "2026-11-18";

const WF = ["設計規劃","節點開發","首次跑通","五次跑通","用戶驗收","上線"];
const SKILL = ["現況調研","技能設計","建置","實測驗證","推廣接入"];

const MODULES = [
  {no:"①", name:"課題研究", col:0, reqs:[
    {proj:"Mac Mini 部署試驗", name:"驗證兩台", type:"research", dri:null, q:"可穩定運行的模型上限", rep:null},
    {proj:"Mac Mini 部署試驗", name:"驗證四台", type:"research", dri:null, q:"模型上限與 Hiring Agent 端到端結果", rel:"以 AI Hiring Agent 驗證", rep:null},
    {proj:"Codio 使用與活化", name:"IDE 串接研究", type:"research", dri:null, q:"從 IDE 使用 Codio 與直接使用的差異", rep:null},
    {proj:"新 Skill 研究與建置", name:"Presentation Skill", type:"deliver", dri:null, steps:SKILL, rel:"之後接上 Nomi",
     sub:{at:2, items:["目標／對象／架構／內容梳理","風格與排版","品管與檢查驗證"]}, rep:null},
    {proj:"新 Skill 研究與建置", name:"Development Skill", type:"deliver", dri:null, steps:SKILL, rel:"由 Codio 執行，InvestGo 驗證",
     sub:{at:2, items:["需求梳理","SRS","原型設計","開發設計文檔","程式碼生成校正","上線運維","測試用例生成"]}, rep:null}
  ]},
  {no:"②", name:"案例開發", col:1, reqs:[
    {proj:"Lab Collab Mate", name:"客戶軟體驗證", type:"deliver", dri:"Simon、Gary、景棠、熙宁", steps:WF,
     ms:[["2026-11-18","Bundle 首次跑通"],["2026-11-20","proxima 首次跑通"],["2026-11-25","Bundle 五次跑通"],["2026-11-27","proxima 五次跑通、EFI 首次跑通"],["2026-12-02","EFI 五次跑通"],["2026-12-11","正式上線"]],
     rep:null,
     last:{date:"2026-11-11", now:1, subs:[["Bundle",1],["proxima",1],["EFI",-1]],
           text:"Bundle 4 個節點完成、串接 2 個並投入實際業務；proxima 2 個節點完成"}},
    {proj:"Lab Collab Mate", name:"產品 Panic 處理", type:"deliver", dri:"Simon、Gary、熙宁", steps:WF, start:"2026-12-01",
     ms:[["2026-11-27","串口方案定案"],["2026-12-01","開始工具開發與串連"],["2026-12-11","首次跑通"],["2026-12-18","五次跑通"],["2027-01-08","正式上線"]],
     rep:null, last:{date:"2026-11-11", now:-1}},
    {proj:"Lab Collab Mate", name:"產品測試軟體開發", type:"deliver", dri:"熙宁", steps:WF, start:"2026-12-14", rel:"調研 Codio 融入工作流",
     ms:[["2026-12-14","開始調研"],["2027-01-08","給出時程"]], rep:null, last:{date:"2026-11-11", now:-1}},
    {proj:"Lab Collab Mate", name:"產品失效分析", type:"deliver", dri:"万峰、景棠", steps:WF, start:"2026-12-14", rel:"調研 AI FA 融入工作流",
     ms:[["2026-12-14","開始調研"],["2027-01-08","給出時程"]], rep:null, last:{date:"2026-11-11", now:-1}},
    {proj:"Lab Collab Mate", name:"LabMind 接入", type:"deliver", dri:null, steps:["架構研究","適配設計","資源評估與準備","正式串連測試","用戶 Try Run"],
     ms:[["2026-11-16","開始架構研究"],["2026-12-07","適配設計、資源評估與準備同時開始"],["2026-12-11","和 LabMind 團隊定案方案 A／B"],["2027-01-08","部署方案提案會"]],
     rep:null}
  ]},
  {no:"③", name:"導入試用", col:2, reqs:[
    {proj:"Codio 使用與活化", name:"大型系統類開發", type:"promo", dri:null, rel:"與 Development Skill 共用 InvestGo 驗證", rep:null},
    {proj:"Nomi 使用與活化", name:"AAS 系統重構", type:"deliver", dri:null, steps:null, desc:"xTrack 重構為 Xylon", rep:null}
  ]},
  {no:"④", name:"推廣複用", col:2, reqs:[
    {proj:"AI Hiring Agent", name:"開放複用", type:"promo", dri:null, nums:["尋求","申請","已上線"], numUnit:"單位", rep:null},
    {proj:"Codio 使用與活化", name:"工具腳本類開發", type:"promo", dri:null, rep:null}
  ]}
];

/* ===== 計算與呈現 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dn = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) / 864e5;
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
const BASE = dn(ASOF);
const REQS = MODULES.flatMap(m => m.reqs);
const reported = REQS.filter(r => r.rep);
const helps = reported.filter(r => r.rep.help);
const progressed = reported.filter(r => (r.rep.done || []).length).length;
const projCount = new Set(REQS.map(r => r.proj)).size;

/* 標題與四個數字 */
$("h1").innerHTML = `本週進度<span class="mono">${md(WEEK.from)}–${md(WEEK.to)}</span>`;
$("asof").textContent = `資料截至 ${md(ASOF)}・已回報 ${reported.length}／${REQS.length}`;
const kpi = (c, n, t, d, cls = "") => `<div class="kpi ${cls}" style="--c:var(${c})"><b>${n}</b><span class="t">${t}</span>${d ? `<div class="d">${d}</div>` : ""}</div>`;
$("kpis").innerHTML =
  kpi("--accent", projCount, "個項目") +
  kpi("--accent", REQS.length, "個需求") +
  kpi("--ok", progressed, "個需求<br>本週有進度") +
  kpi(helps.length ? "--bad" : "--idle", helps.length, "件需要<br>副總幫忙",
      helps.length ? helps.map(r => `<div><b>${esc(r.name)}</b>：${esc(r.rep.help)}</div>`).join("") : `<div class="dim">本週沒有需要副總幫忙的事項</div>`, "help");

/* 本週亮點：「項目・需求：進度亮點」。回報中標記 hl 的完成事項；沒標記時取各需求第一件，最多 6 件 */
let hls = reported.flatMap(r => (r.rep.hl || []).map(i => [r.rep.done[i], r]));
if (!hls.length) hls = reported.filter(r => (r.rep.done || []).length).map(r => [r.rep.done[0], r]);
hls = hls.slice(0, 6);
$("hl").innerHTML = hls.length
  ? `<ul>${hls.map(([t, r]) => `<li><span class="p">${esc(r.proj)}・${esc(r.name)}</span>：${esc(t)}</li>`).join("")}</ul>`
  : `<div class="empty">本週回報彙整中；負責人回覆後，這裡會列出本週最重要的完成事項。</div>`;

/* 需求狀態標籤：一個詞說清楚現在在哪 */
const nowSet = v => new Set([].concat(v ?? []));
function pill(r){
  const src = r.rep || r.last;
  if (r.type === "deliver") {
    if (!r.steps) return ["idle", r.rep ? "步驟待定" : "待回報"];
    const now = src ? src.now : null;
    if (now == null) return ["idle", "待回報"];
    const set = nowSet(now), started = [...set].some(i => i >= 0);
    if (!started) return ["idle", r.start ? `預計 ${md(r.start)} 開始` : "尚未開始"];
    if (r.sub && set.has(r.sub.at)) return ["", `${r.steps[r.sub.at]}・子階段 ${src.subDone || 0}／${r.sub.items.length}`.replace(/(\d+)／(\d+)/, "$1 個完成、共 $2 個")];
    return ["", [...set].filter(i => i >= 0).map(i => r.steps[i]).join("、")];
  }
  if (r.type === "research") return r.rep ? (r.rep.conclusion ? ["ok", "已有結論"] : ["", "測試中"]) : ["idle", "待回報"];
  if (r.nums) return r.rep && r.rep.nums ? ["", r.nums.map(n => `${n} ${r.rep.nums[n] ?? "–"}`).join("・")] : ["idle", "待回報"];
  return r.rep ? ["", "推廣中"] : ["idle", "待回報"];
}
/* 滑鼠提示：DRI、關聯、下一里程碑、子項狀態、步驟 */
function tip(r){
  const src = r.rep || r.last, t = [`DRI：${r.dri || "待補"}`];
  if (r.rel) t.push(`關聯：${r.rel}`);
  if (r.steps) t.push(`步驟：${r.steps.join(" → ")}`);
  if (r.sub) t.push(`${r.steps[r.sub.at]}的子階段：${r.sub.items.join("、")}`);
  if (src && src.subs) t.push(src.subs.map(([n, i]) => `${n}：${i >= 0 ? r.steps[i] : "未開始"}`).join("；") + (r.rep ? "" : `（${md(src.date)} 回報）`));
  const m = (r.ms || []).find(x => dn(x[0]) >= BASE); if (m) t.push(`下一里程碑：${md(m[0])} ${m[1]}`);
  if (r.type === "research") t.push(`要回答：${r.q}`);
  if (r.desc) t.push(r.desc);
  return t.join("\n");
}
function reqHTML(r){
  const [cls, word] = pill(r);
  let rows = "";
  if (r.rep && r.rep.conclusion) rows += `<div class="ln concl"><span class="k">結論</span>${esc(r.rep.conclusion)}</div>`;
  if (r.rep) {
    const ln = (arr, c, k) => `<div class="ln ${c}"><span class="k">${k}</span>${arr && arr.length ? esc(arr[0]) + (arr.length > 1 ? `<small>等 ${arr.length} 件</small>` : "") : `<span class="dim">—</span>`}</div>`;
    rows += ln(r.rep.done, "done", "本週") + ln(r.rep.next, "next", "下週");
  } else if (r.last && r.last.text) {
    rows += `<div class="ln next"><span class="k">上次</span>${md(r.last.date)}：${esc(r.last.text)}</div>`;
  }
  return `<div class="req" title="${esc(tip(r))}"><div class="rh"><span class="rn">${esc(r.name)}</span><span class="pill ${cls}">${esc(word)}</span></div>${rows}</div>`;
}
function modHTML(m){
  let html = "", proj = null;
  m.reqs.forEach(r => { if (r.proj !== proj) { proj = r.proj; html += `<h4 class="proj">${esc(proj)}</h4>`; } html += reqHTML(r); });
  return `<section class="mod" data-m="${MODULES.indexOf(m) + 1}"><header><h3><span class="no">${m.no.replace(/[①②③④]/, c => "①②③④".indexOf(c) + 1)}</span>${esc(m.name)}</h3><span>${m.reqs.length} 個需求</span></header><div class="mbody">${html}</div></section>`;
}
$("board").innerHTML = [0, 1, 2].map(c => `<div class="col">${MODULES.filter(m => m.col === c).map(modHTML).join("")}</div>`).join("");
</script>
</body>
</html>
