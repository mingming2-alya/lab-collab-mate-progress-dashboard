:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1960px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.3}
h2{font-size:20px}
h3{font-size:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{margin:0;max-width:80ch;color:var(--muted)}
header{display:flex;flex-direction:column;gap:10px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:30px;height:18px;border-radius:4px;display:inline-block;font-style:normal}
.sw.solid{background:var(--surface);border:1.5px solid var(--line)}
.sw.usw{background:var(--user-soft);border:1.5px solid var(--user)}
.sw.gapsw{background:var(--gap-soft);border:1.5px dashed var(--gap)}
.sw.mocksw{background:var(--mock-soft);border-radius:9px;width:40px;font-size:11px;color:var(--mock);text-align:center;line-height:18px;font-weight:700}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll svg{display:block;width:100%;min-width:960px;height:auto;margin:0 auto}
.scroll svg.narrow{max-width:1000px}
figcaption{font-size:14px;color:var(--muted);max-width:80ch}
svg{color:var(--fg);font-family:var(--f-body)}
.band{fill:var(--band)}
.uband{fill:var(--user-soft)}
.bl{fill:var(--muted);font-size:13px;font-weight:700;letter-spacing:.06em}
.lane{fill:var(--muted);font-size:14px;font-weight:700;letter-spacing:.08em}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ubox{fill:var(--ubox);stroke:var(--user);stroke-width:1.5}
.gap{fill:var(--gap-soft);stroke:var(--gap);stroke-width:1.6;stroke-dasharray:7 5}
.tagbox{fill:var(--head);stroke:none}
.head{fill:var(--head)}
.tt{fill:var(--fg);font-size:14.5px;font-weight:700}
.ts{fill:var(--muted);font-size:12.5px}
.ts2{fill:var(--fg);font-size:13px}
.tagr{fill:var(--mock-soft)}
.tagt{fill:var(--mock);font-size:11.5px;font-weight:700}
.ar{fill:none;stroke:var(--fg);stroke-width:1.5}
.userar{stroke:var(--user);stroke-width:2}
.ln{stroke:var(--fg);stroke-width:2;fill:none}
.gapar{stroke:var(--gap);stroke-dasharray:6 5}
.ahp{fill:var(--fg)} .ahg{fill:var(--gap)} .ahu{fill:var(--user)}
.al{fill:var(--fg);font-size:12px;font-weight:500}
.ual{fill:var(--user);font-weight:700}
.div{stroke:var(--user);stroke-width:1.5}
.divt{fill:var(--user);font-size:12.5px;font-weight:700}
.zone{fill:var(--muted);font-size:13px;letter-spacing:.14em;font-weight:700}
.zu{fill:var(--user)}
.zline{stroke:var(--line);stroke-width:2;fill:none}
.zlu{stroke:var(--user)}
.g-user{fill:var(--user-soft);stroke:var(--user-line);stroke-width:1.2}
.g-plat{fill:var(--plat);stroke:var(--line);stroke-width:1.2}
.g-comp{fill:var(--comp-soft);stroke:var(--comp-line);stroke-width:1.2}
.g-stn{fill:var(--stn-soft);stroke:var(--stn-line);stroke-width:1.2}
.g-base{fill:var(--band);stroke:var(--line);stroke-width:1.2}
.gt{fill:var(--fg);font-size:15px;font-weight:700}
.gt-user{fill:var(--user)} .gt-comp{fill:var(--comp)} .gt-stn{fill:var(--stn)}
.c-solid{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.c-user{fill:var(--surface);stroke:var(--user-line);stroke-width:1.2}
.c-comp{fill:var(--surface);stroke:var(--comp-line);stroke-width:1.2}
.c-stn{fill:var(--surface);stroke:var(--stn-line);stroke-width:1.2}
.c-dark{fill:var(--comp)}
.c-gap{fill:var(--gap-soft);stroke:var(--gap);stroke-width:1.6;stroke-dasharray:6 4}
.ct{fill:var(--fg);font-weight:500}
.ct-gap{fill:var(--gap);font-weight:700}
.ct-dark{fill:var(--surface);font-weight:700}
.ba-flow{fill:var(--arrow-soft);stroke:var(--arrow);stroke-width:1.4;stroke-linejoin:round}
.ba-gapflow{fill:var(--gap-soft);stroke:var(--gap);stroke-width:1.4;stroke-dasharray:5 3;stroke-linejoin:round}
.cy{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.cy-gap{fill:var(--gap-soft);stroke:var(--gap);stroke-width:1.5;stroke-dasharray:6 4}
.ic-user{fill:var(--surface);stroke:var(--user);stroke-width:2}
.ic-comp{fill:var(--surface);stroke:var(--comp);stroke-width:2}
.ic-dot{fill:var(--comp)}
.ic-stn{fill:var(--surface);stroke:var(--stn);stroke-width:2}
.ict{fill:var(--fg);font-size:13px;font-weight:500}
.rl{fill:var(--rl)}
.rlt{fill:var(--rl-fg);font-size:13px;font-weight:700}
.chev{fill:var(--muted)}
.hint{fill:var(--muted);font-size:12px}
.sub{fill:var(--fg);font-size:14px;font-weight:700}
.g-link{fill:var(--link-soft);stroke:var(--link-line);stroke-width:1.2}
.gt-link{fill:var(--link)}
.lane{fill:var(--lane)} .lane-on{fill:var(--lane-on)}
.lk{stroke:var(--gap);stroke-width:1.3;stroke-dasharray:3 3;fill:none}
.sl{paint-order:stroke;stroke:var(--plat);stroke-width:4px;stroke-linejoin:round}
.sub2{font-size:13px;font-weight:700}
.band2{fill:var(--band2);stroke:var(--line);stroke-width:1}
.g-sub{fill:var(--surface);stroke:var(--link-line);stroke-width:1.2}
.guard{fill:var(--surface);stroke:var(--gap);stroke-width:1.3;stroke-dasharray:4 3}
.sw.p2sw{background:var(--p2-soft);border:1.5px solid var(--p2)}
.c-new{fill:var(--p2-soft);stroke:var(--p2);stroke-width:1.6}
.ct-new{fill:var(--p2);font-weight:700}
.cy-new{fill:var(--p2-soft);stroke:var(--p2);stroke-width:1.5}
.sl-n{fill:none;stroke:var(--p2);stroke-width:2.2}
.ahn{fill:var(--p2)}
.sln{fill:var(--p2)}
.g-subu{fill:var(--surface);stroke:var(--user-line);stroke-width:1.2}
.g-subn{fill:var(--surface);stroke:var(--p2);stroke-width:1.2}
.rowt{fill:var(--muted);font-size:13px;font-weight:700;letter-spacing:.06em}
.sl-i{fill:none;stroke:var(--fg);stroke-width:2}
.sl-u{fill:none;stroke:var(--user);stroke-width:2.2}
.sl-g{fill:none;stroke:var(--gap);stroke-width:2;stroke-dasharray:5 4}
.bd-i{fill:var(--fg)} .bd-u{fill:var(--user)} .bd-g{fill:var(--gap)}
.bdt{fill:var(--bg);font-size:12.5px;font-weight:700;font-family:var(--f-mono)}
.sl{fill:var(--fg);font-size:12px;font-weight:700}
.slu{fill:var(--user)} .slg{fill:var(--gap)}
.steps{margin:0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:6px 18px;font-size:14px}
.steps li{display:flex;gap:8px;align-items:baseline;min-width:0}
.steps .n{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--bg);background:var(--fg)}
.steps .n.u{background:var(--user)} .steps .n.g{background:var(--gap)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;min-width:0}
.note b{display:block;margin-bottom:2px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500;background:var(--band);white-space:nowrap}
tbody th{font-weight:700;white-space:nowrap}
tbody th code{display:block;font-weight:400;color:var(--muted);font-size:12px}
tr.grp td{background:var(--band);font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-block:6px}
td.n{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
td.item{font-weight:700;white-space:nowrap}
.q{display:inline-block;font-size:12px;padding:0 8px;border:1px dashed var(--gap);border-radius:4px;background:var(--gap-soft);color:var(--gap);white-space:nowrap}
.mk{display:inline-block;font-size:12px;padding:0 8px;border-radius:9px;background:var(--mock-soft);color:var(--mock);font-weight:700;white-space:nowrap}
.src{font-size:11px;color:var(--muted)}
.who{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--gap-soft);color:var(--gap);font-weight:700;white-space:nowrap}
.who.me{background:var(--mock-soft);color:var(--mock)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
code{font-family:var(--f-mono);font-size:.92em}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-8px}
.tabs a{font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;padding:8px 14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--user)}
.tabs a:focus-visible{outline:2px solid var(--user);outline-offset:2px;border-radius:4px}
.note-src{font-size:12px;color:var(--muted)}
/* 統一風格（與總覽、每日進度頁一致）：礦物暖紙底、深松青主色、微軟雅黑；架構圖本身的配色不動 */
:root{--brand:#154A41;--page-bg:#F4F4F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#59C2AE;--page-bg:#0E1412}}
:root[data-theme="dark"]{--brand:#59C2AE;--page-bg:#0E1412}
body{background:var(--page-bg);font-family:"Microsoft YaHei","微软雅黑","PingFang TC","PingFang SC","Noto Sans TC",system-ui,sans-serif}
.tabs a[aria-current="page"]{border-bottom-color:var(--brand)}
.tabs a:focus-visible{outline-color:var(--brand)}
h1{font-family:inherit;font-weight:900;letter-spacing:.04em;padding-left:14px;border-left:5px solid var(--brand);line-height:1.15}
/* 返回總覽：和分頁區隔開，不是分頁 */
.tabs a.back{border-bottom-color:transparent;margin-right:10px;padding-left:0;padding-right:14px;position:relative;font-weight:500}
.tabs a.back::after{content:"";position:absolute;right:0;top:25%;bottom:25%;border-right:1px solid var(--line)}
/* 橫向捲動容器邊緣漸層陰影，以視覺取代「可左右滑動」文字說明 */
.scroll{
  background:
    linear-gradient(to right, var(--surface) 20%, transparent),
    linear-gradient(to left, var(--surface) 20%, transparent),
    radial-gradient(farthest-side at 0 50%, rgba(20,30,27,.14), transparent),
    radial-gradient(farthest-side at 100% 50%, rgba(20,30,27,.14), transparent);
  background-position: 0 0, 100% 0, 0 0, 100% 0;
  background-repeat: no-repeat;
  background-size: 36px 100%, 36px 100%, 14px 100%, 14px 100%;
  background-attachment: local, local, scroll, scroll;
}
</style>
