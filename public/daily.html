<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lab Collab Mate 每日進度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面（2026-11-19 改版・方案 A 宏觀 6 列甘特主從總控台＋零重複微觀細節）：
   與總覽頁統一礦物暖紙＋深松青語系；上層整體里程碑嚴格只放 5 模塊＋共用基礎共 6 列，
   下層模塊詳情才展開各模塊子工作線時程（支援單項聚焦＋常駐風險雷達 / 全部展開雙模式）。
   燈號規則：模塊含 decide 至少升為受阻（red）；含 risk（待追蹤風險）自動至少升為注意（yellow）。 */
:root{
  --ground:#F4F4F0; --paper:#FFFFFF; --paper-dim:#FAF9F6;
  --ink:#141E1B; --ink-2:#36433F; --muted:#63706C; --faint:#94A09C;
  --rule:#E3E3DC; --rule-soft:#EFEFE9; --grid-line:#ECECE6;
  --pine:#154A41; --pine-mid:#1D5E53; --pine-soft:#E5F1EE;
  --ok:#157347; --ok-soft:#E3F5EB; --ok-bd:#A7DFC0;
  --warn:#A85000; --warn-soft:#FDF3DF; --warn-bd:#F3D49C; --warn-ink:#7C3D08;
  --bad:#B91C1C; --bad-soft:#FDEAEA; --bad-bd:#F5BCBC;
  --try:#446696; --try-soft:#E8EFF8; --try-bd:#A5BCD9;
  --idle-ink:#7D8985; --idle-soft:#EFEFE9; --idle-bd:#D0D4CE;
  --today:#C2410C;
  --f-body:"Microsoft YaHei","微软雅黑","PingFang TC","PingFang SC","Noto Sans TC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1412; --paper:#161E1C; --paper-dim:#1A2421;
  --ink:#E7EFEA; --ink-2:#BCCAC5; --muted:#8E9E99; --faint:#65746F;
  --rule:#283531; --rule-soft:#202B28; --grid-line:#222E2B;
  --pine:#59C2AE; --pine-mid:#3B9B8A; --pine-soft:#16332E;
  --ok:#63CF95; --ok-soft:#143324; --ok-bd:#2B6347;
  --warn:#F2AE52; --warn-soft:#342611; --warn-bd:#694A1E; --warn-ink:#F6CA86;
  --bad:#F88379; --bad-soft:#3A1919; --bad-bd:#6E2C2C;
  --try:#8AB2E6; --try-soft:#1B2A3E; --try-bd:#36537A;
  --idle-ink:#8A9793; --idle-soft:#222D2A; --idle-bd:#33403C;
  --today:#FB923C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1412; --paper:#161E1C; --paper-dim:#1A2421;
  --ink:#E7EFEA; --ink-2:#BCCAC5; --muted:#8E9E99; --faint:#65746F;
  --rule:#283531; --rule-soft:#202B28; --grid-line:#222E2B;
  --pine:#59C2AE; --pine-mid:#3B9B8A; --pine-soft:#16332E;
  --ok:#63CF95; --ok-soft:#143324; --ok-bd:#2B6347;
  --warn:#F2AE52; --warn-soft:#342611; --warn-bd:#694A1E; --warn-ink:#F6CA86;
  --bad:#F88379; --bad-soft:#3A1919; --bad-bd:#6E2C2C;
  --try:#8AB2E6; --try-soft:#1B2A3E; --try-bd:#36537A;
  --idle-ink:#8A9793; --idle-soft:#222D2A; --idle-bd:#33403C;
  --today:#FB923C;
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.wrap{
  max-width:1440px;margin:0 auto;
  padding-block:14px 36px;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px;
}

/* ===== 導覽與麵包屑 ===== */
.topnav{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid var(--rule);padding-bottom:8px;font-size:13.5px;
}
.tabs{display:flex;align-items:center;gap:18px}
.tabs a{
  color:var(--muted);font-weight:600;text-decoration:none;
  padding:4px 0 9px;margin-bottom:-9px;border-bottom:2.5px solid transparent;
  display:inline-flex;align-items:center;gap:5px;min-height:32px;
}
.tabs a:hover{color:var(--ink)}
.tabs a.back{padding-right:16px;border-right:1px solid var(--rule);border-bottom-color:transparent}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:800;border-bottom-color:var(--pine)}
.tabs a:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.crumb b{color:var(--pine);font-weight:800}

/* ===== 頁首與核心狀態數字 ===== */
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.head-l{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.head h1{font-size:25px;font-weight:900;letter-spacing:.03em;line-height:1.1;color:var(--ink)}
.stats{display:flex;align-items:center;flex-wrap:wrap}
.st-item{
  display:inline-flex;align-items:baseline;gap:5px;
  padding:2px 15px;border-left:1px solid var(--rule);
  font-size:13px;font-weight:700;color:var(--muted);background:none;border-top:0;border-right:0;border-bottom:0;font-family:inherit;
}
.st-item:first-child{padding-left:0;border-left:0}
.st-item b{font-size:24px;font-weight:900;line-height:1;color:var(--ink);letter-spacing:-.02em}
.st-item.brand b{color:var(--pine)}
.st-item.warn{cursor:pointer}
.st-item.warn b,.st-item.warn span{color:var(--warn)}
.st-item.warn:hover{opacity:.76}
.st-item.bad{cursor:pointer}
.st-item.bad b,.st-item.bad span{color:var(--bad)}
.st-item.zero b,.st-item.zero span{color:var(--faint);font-weight:600}

.head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dead-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--ok-soft);color:var(--ok);
  font-size:12px;font-weight:800;padding:5px 11px;border-radius:7px;white-space:nowrap;
}
.date-wrap{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  background:var(--paper);border:1px solid var(--rule);border-radius:7px;
  padding:0 10px;min-height:34px;color:var(--ink);
}
.date-wrap:hover,.date-wrap:focus-within{border-color:var(--pine-mid)}
.date-wrap select{
  appearance:none;background:transparent;border:0;color:var(--ink);
  font-family:var(--f-body);font-size:12.5px;font-weight:700;
  padding:6px 18px 6px 0;cursor:pointer;outline:none;min-height:32px;
}
.date-wrap .cal-chev{position:absolute;right:9px;pointer-events:none;color:var(--muted)}

/* ===== 區段標題 ===== */
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sec-hd-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-hd h2{font-size:15px;font-weight:900;color:var(--ink);letter-spacing:.04em}

/* 極簡 ⓘ 按需氣泡（把 Try Run 門檻藏於按需氣泡，不污染主畫面） */
.info-wrap{position:relative;display:inline-flex}
.info-btn{
  width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);
  color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;transition:all .15s;
}
.info-btn:hover,.info-btn:focus-visible{border-color:var(--pine-mid);color:var(--pine);outline:none}
.info-pop{
  position:absolute;top:calc(100% + 6px);left:0;z-index:45;width:330px;max-width:85vw;
  padding:11px 13px;border-radius:9px;background:#13211E;color:#D7EBE6;
  font-size:12px;line-height:1.55;box-shadow:0 12px 28px rgba(10,24,21,.28);display:none;
}
.info-wrap:hover .info-pop,.info-wrap:focus-within .info-pop{display:block}
.info-pop b{color:#7BE6CD;display:block;margin-bottom:3px}

/* 單項／全部切換器 */
.seg-ctrl{display:inline-flex;background:var(--rule);padding:3px;border-radius:8px;gap:2px}
.seg-btn{
  border:0;background:transparent;color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:700;padding:4px 11px;min-height:28px;border-radius:6px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;
}
.seg-btn.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}

/* ===== ① 整體里程碑甘特圖（宏觀層・嚴格 6 列） ===== */
.g-panel{
  background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden;
  box-shadow:0 2px 10px rgba(20,30,27,.03);
}
.g-legend{
  display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;
  padding:7px 16px;border-bottom:1px solid var(--rule-soft);background:var(--paper-dim);
  font-size:11.5px;color:var(--muted);font-weight:600;
}
.g-legend span{display:inline-flex;align-items:center;gap:5px}
.sym-b1{width:14px;height:7px;border-radius:2px;background:var(--pine-mid)}
.sym-b2{width:14px;height:7px;border-radius:2px;background:var(--pine-soft);border:1px solid #8CB7AE}
.sym-o{width:8px;height:8px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.sym-g{width:7px;height:7px;transform:rotate(45deg);background:var(--warn)}
.sym-l{width:8px;height:8px;transform:rotate(45deg);background:var(--ok)}

.g-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.g-body{min-width:920px;padding:0 14px 8px}

.g-row{
  display:grid;grid-template-columns:240px minmax(0,1fr) 182px 26px;
  align-items:center;border-top:1px solid var(--rule-soft);min-height:42px;
  transition:background .14s ease;
}
.g-row.axis{border-top:0;min-height:40px}
.g-row.clickable{cursor:pointer}
.g-row.clickable:hover{background:var(--pine-soft)}
.g-row.clickable:hover .g-chev{color:var(--pine);transform:translateX(2px)}
.g-row.selected{background:var(--pine-soft)!important;box-shadow:inset 3.5px 0 0 var(--pine)}
.g-row.selected .g-chev{color:var(--pine);transform:rotate(90deg)}
.g-row.infra-row{border-top:1.5px dashed var(--rule)}
.g-row.infra-row.selected{background:var(--warn-soft)!important;box-shadow:inset 3.5px 0 0 var(--warn)}
.g-row.is-idle .g-mname{color:var(--idle-ink);font-weight:700}
.g-row.is-idle .g-mno{color:var(--faint)}

.g-left{padding:6px 10px 6px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.g-mtitle{display:flex;align-items:center;gap:6px;min-width:0}
.g-mno{font-size:11.5px;font-weight:900;color:var(--pine-mid)}
.g-mname{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.upd-dot{width:6px;height:6px;border-radius:50%;background:var(--pine-mid);flex:none}

.st-pill{
  display:inline-flex;align-items:center;gap:3px;
  font-size:11px;font-weight:700;padding:1.5px 7px;border-radius:999px;white-space:nowrap;
}
.st-pill.green,.st-pill.done{background:var(--ok-soft);color:var(--ok)}
.st-pill.yellow{background:var(--warn-soft);color:var(--warn)}
.st-pill.red{background:var(--bad-soft);color:var(--bad)}
.st-pill.idle{background:var(--idle-soft);color:var(--idle-ink);font-weight:500}

.g-trk{
  position:relative;height:42px;
  background:repeating-linear-gradient(to right,var(--grid-line) 0 1px,transparent 1px calc(100% / var(--wks,12)));
}
.v-today{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--today);z-index:2;pointer-events:none}
.v-dead{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--ok);z-index:1;opacity:.72;pointer-events:none}
.ax-mo{position:absolute;top:2px;font-size:11px;font-weight:800;color:var(--ink);border-left:1px solid var(--faint);padding-left:4px;line-height:14px}
.ax-wk{position:absolute;bottom:3px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.todayl{
  position:absolute;top:1px;transform:translateX(-50%);
  font-size:10.5px;font-weight:800;color:#FFFFFF;background:var(--today);
  padding:0 5px;border-radius:3px;z-index:4;white-space:nowrap;
}
.deadl{
  position:absolute;top:1px;transform:translateX(-50%);
  font-size:10.5px;font-weight:800;color:var(--ok);background:var(--ok-soft);
  border:1px solid var(--ok-bd);padding:0 5px;border-radius:3px;z-index:4;white-space:nowrap;
}

.gbar{
  position:absolute;top:11px;height:20px;border-radius:4px;
  font-size:11px;font-weight:700;line-height:18px;padding:0 7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;
}
.gbar.now{background:var(--pine-mid);color:#FFFFFF}
.gbar.past{background:var(--idle-soft);color:var(--idle-ink);border:1px solid var(--idle-bd);font-weight:500}
.gbar.plan{background:var(--pine-soft);color:var(--pine);border:1px solid #9FC4BC}
.gbar.try{background:var(--try-soft);color:var(--try);border:1px solid var(--try-bd)}
.gbar.idle{background:var(--idle-soft);color:var(--idle-ink);border:1px solid var(--idle-bd);font-weight:600}
.gbar.tbd-tail{
  background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(148,160,156,.16) 4px 8px);
  border:1px dashed var(--faint);color:var(--muted);font-weight:600;padding-left:13px;
}

.gmk{position:absolute;top:15px;width:11px;height:11px;transform:translateX(-50%);z-index:4;border:2px solid var(--paper);box-sizing:content-box;margin-top:-2px}
.gmk.first{border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2.5px var(--ink)}
.gmk.stable{border-radius:50%;background:var(--ink)}
.gmk.gate{width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--warn);margin-top:-1px}
.gmk.live{width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:var(--ok);margin-top:-1px}

.g-right{padding:4px 4px 4px 12px;font-size:11.5px;line-height:1.36;color:var(--muted);display:flex;flex-direction:column;justify-content:center}
.g-right b{color:var(--ink);font-weight:800}
.g-right .wt{color:var(--warn);font-weight:700}
.g-right .ot{color:var(--ok);font-weight:800}
.g-chev{display:grid;place-items:center;color:var(--faint);transition:transform .16s ease,color .16s ease}

/* ===== ② 模塊詳情（微觀層・零重複同構） ===== */
.mod-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mpill{
  border:1px solid var(--rule);background:var(--paper);color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:700;padding:4px 10px;min-height:30px;border-radius:999px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .14s;
}
.mpill:hover{border-color:var(--pine-mid);color:var(--ink)}
.mpill.active{background:var(--pine);border-color:var(--pine);color:#FFFFFF}
.mpill.warn-p:not(.active){border-color:var(--warn-bd);color:var(--warn)}
.mpill.red-p:not(.active){border-color:var(--bad-bd);color:var(--bad)}

.focus-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:14px;align-items:start}
.all-stack{display:flex;flex-direction:column;gap:12px}

.mcard{
  background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--pine);
  border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,30,27,.03);
}
.mcard.is-yellow{border-top-color:var(--warn)}
.mcard.is-red{border-top-color:var(--bad)}
.mcard.is-idle{background:var(--paper-dim);border-top:2px solid var(--idle-bd);box-shadow:none}

.mcard-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper-dim);
}
.mcard.is-idle .mcard-hd{padding-block:8px}
.mcard-hl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcard-hl h3{font-size:16px;font-weight:900;color:var(--ink);display:flex;align-items:baseline;gap:7px}
.mcard-hl h3 .no{color:var(--pine-mid);font-size:13.5px}
.mcard-hl h3 .subnm{font-size:12px;font-weight:500;color:var(--muted)}
.mcard.is-idle .mcard-hl h3{color:var(--idle-ink);font-size:14.5px}
.mcard.is-idle .mcard-hl h3 .no{color:var(--faint)}
.chip-upd{font-size:11px;font-weight:800;background:var(--pine-soft);color:var(--pine);padding:1.5px 7px;border-radius:4px}
.chip-live{font-size:11px;font-weight:800;background:var(--ok-soft);color:var(--ok);padding:1.5px 7px;border-radius:4px}
.mcard-meta{display:inline-flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-weight:600}
.mcard-meta span{display:inline-flex;align-items:center;gap:4px}

.mcard-body{padding:11px 16px 13px;display:flex;flex-direction:column;gap:11px}

/* 子工作線橫向時程（.line 保留給 check_basedate.js） */
.line{
  display:grid;grid-template-columns:188px minmax(0,1fr);gap:8px 16px;
  padding:7px 0;border-bottom:1px dashed var(--rule);align-items:start;
}
.line:first-child{padding-top:2px}
.line:last-child{border-bottom:0;padding-bottom:2px}
.tl-name{font-size:13.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mcard.is-idle .tl-name{color:var(--idle-ink);font-weight:700}
.tl-who{font-size:11.5px;color:var(--muted);margin-top:1px}
.tl-kpi{
  display:inline-block;margin-top:4px;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:4px;background:var(--pine-soft);color:var(--pine);
}
.tl-kpi.warn{background:var(--warn-soft);color:var(--warn)}
.tl-kpi.idle{background:var(--idle-soft);color:var(--idle-ink);font-weight:500}

.hsteps{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
.hsteps li{position:relative;padding:17px 8px 0 0;display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.36}
.hsteps li::before{content:"";position:absolute;top:5.5px;left:0;right:0;height:2px;background:var(--rule)}
.hsteps li:last-child::before{display:none}
.hsteps li.now::before,.hsteps li.past::before{background:var(--pine-mid)}
.hsteps .nd{position:absolute;top:1px;left:0;z-index:2}
.nd-bar{width:20px;height:9px;border-radius:3px;background:var(--pine-soft);border:1.5px solid var(--pine-mid)}
.nd-bar.now{background:var(--pine-mid)}
.nd-bar.past{background:var(--idle-soft);border-color:var(--idle-ink)}
.nd-bar.try{background:var(--try-soft);border-color:var(--try)}
.nd-bar.tbd{background:var(--paper);border:1.5px dashed var(--faint)}
.nd-bar.idle{background:var(--idle-soft);border-color:var(--idle-bd)}
.nd-o{width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.nd-o.tbd{border-color:var(--faint)}
.nd-f{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.nd-f.tbd{background:var(--faint)}
.nd-gate{width:9px;height:9px;transform:rotate(45deg);background:var(--warn);top:2px!important}
.nd-live{width:10px;height:10px;transform:rotate(45deg);background:var(--ok);top:1px!important}
.hsteps .dt{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.hsteps .nm{font-weight:700;color:var(--ink)}

.exec-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:9px;border-top:1px solid var(--rule-soft)}
.exec-2col.one{grid-template-columns:1fr}
.exec-box{display:flex;flex-direction:column;gap:4px;font-size:12.8px;line-height:1.54;color:var(--ink-2)}
.exec-box h4{font-size:11.5px;font-weight:800;color:var(--pine);letter-spacing:.04em}
.exec-box b{color:var(--ink)}

.risk-box{
  background:var(--warn-soft);border:1px solid var(--warn-bd);border-radius:7px;
  padding:8px 12px;font-size:12.5px;line-height:1.48;color:var(--warn-ink);
  display:flex;gap:9px;align-items:baseline;
}
.risk-box.decide{background:var(--bad-soft);border-color:var(--bad-bd);color:var(--bad)}
.risk-box .rk{font-weight:800;color:var(--warn);white-space:nowrap}
.risk-box.decide .rk{color:var(--bad)}
.handled-box{
  font-size:12px;color:var(--muted);padding:6px 10px;
  background:var(--paper-dim);border:1px solid var(--rule-soft);border-radius:6px;
  display:flex;gap:8px;align-items:baseline;
}
.handled-box .hk{color:var(--ok);font-weight:800;white-space:nowrap}

.rel-row{display:flex;flex-wrap:wrap;gap:7px}
.rel-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;
  padding:3px 9px;border-radius:5px;background:var(--ground);border:1px solid var(--rule);
}
.rel-chip .who{color:var(--muted);font-size:11.5px}
.rel-chip .done{color:var(--ok);font-weight:800;font-size:11px}
.rel-chip .doing{color:var(--pine);font-weight:700;font-size:11px}
.rel-chip .todo{color:var(--idle-ink);font-size:11px}

/* 右側常駐風險雷達 */
.radar{
  background:var(--paper);border:1px solid var(--rule);border-radius:10px;
  padding:13px 14px;display:flex;flex-direction:column;gap:9px;
  box-shadow:0 2px 10px rgba(20,30,27,.03);
}
.radar-hd{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:900;color:var(--warn)}
.radar-cnt{font-size:11px;font-weight:800;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:999px}
.radar-item{
  width:100%;text-align:left;font-family:inherit;
  padding:9px 11px;border-radius:7px;background:var(--warn-soft);border:1px solid var(--warn-bd);
  font-size:12px;line-height:1.46;color:var(--warn-ink);cursor:pointer;transition:all .15s ease;
  display:grid;grid-template-columns:minmax(0,1fr) 14px;gap:4px 8px;align-items:start;
}
.radar-item:hover{filter:brightness(.97)}
.radar-item:hover .r-arr{transform:translateX(2.5px)}
.radar-item.is-cur{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.r-mod{font-size:11px;font-weight:800;color:var(--warn);margin-bottom:2px}
.r-title{font-weight:800;color:var(--ink);display:block;margin-bottom:1px}
.r-arr{color:var(--warn);margin-top:2px;transition:transform .15s ease}
.radar-empty{font-size:12.5px;color:var(--muted);padding:4px 0}

@media (prefers-reduced-motion:reduce){.g-row,.g-chev,.radar-item,.r-arr,.mpill,.seg-btn{transition:none}}

@media (max-width:1060px){

}

const leftTxt = d => d === TODAY ? "當天" : d > TODAY ? `剩 ${d - TODAY} 天` : `已過 ${TODAY - d} 天`;

function modOf(r, M){
  const P = no => r.projects.find(p => p.no === no);
  const wsList = [...new Set([...(M.progWs||[]), ...(M.nextWs||[]), ...(M.issueWs||[])])].map(P).filter(Boolean);
  const issues = [
    ...(M.issueWs||[]).flatMap(no => (P(no)?.issues||[]).filter(x => !x.mod || x.mod === M.name)),
    ...(M.issueMod ? r.projects.flatMap(p => (p.issues||[]).filter(x => x.mod === M.issueMod)) : [])
  ];
  const lineSts = (M.lines||[]).map(l => {
    if (!l.ws) return "idle";
    const p = P(l.ws);
    if (l.item && p?.items) {
      const it = p.items.find(x => x[0] === l.item);
      return it && it[3] && it[3] !== "todo" ? (it[3] === "done" ? "done" : p.status) : "idle";
    }
    return p ? p.status : "idle";
  });
  const baseSt = [...lineSts, ...wsList.map(p => p.status)].reduce((a, b) => RANK[b] > RANK[a] ? b : a, "idle");
  /* 新燈號規則：只要模塊含 decide 至少升為受阻(red)；含 risk 待追蹤風險自動至少升為注意(yellow) */
  let status = baseSt;
  if (issues.some(x => x.type === "decide") && RANK.red > RANK[status]) status = "red";
  else if (issues.some(x => x.type === "risk") && RANK.yellow > RANK[status] && status !== "idle") status = "yellow";
  else if (issues.some(x => x.type === "risk") && status === "idle" && M.id === "m5" && P(7)?.status !== "idle") status = "yellow";

  const progParts = (M.progWs||[]).map(no => P(no)?.update).filter(Boolean);
  const nextParts = (M.nextWs||[]).map(no => P(no)?.next).filter(Boolean);
  const tools = (M.tools||[]).map(t => {
    const it = P(t.ws)?.items?.find(x => x[0] === t.item) || [t.item,"—","未開始","todo"];
    return {name:it[0], who:it[1], lab:it[2]||"未開始", k:it[3]||"todo"};
  });
  const rel = (M.rel||[]).map(x => {
    if (x.ws) {
      const it = P(x.ws)?.items?.find(y => y[0] === x.item) || [x.label||x.item,"—","未開始","todo"];
      return {name:x.label||it[0], who:it[1], lab:it[2]||"未開始", k:it[3]||"todo"};
    }
    return {name:x.label, who:x.owner||"—", lab:"未開始", k:"todo"};
  });
  const lineKpis = (M.lines||[]).map(l => {
    if (!l.ws) return "";
    const p = P(l.ws);
    if (l.item && p?.items) {
      const it = p.items.find(x => x[0] === l.item);
      return it ? (it[2] || "") : "";
    }
    return p?.state || "";
  });
  const owners = [...new Set([
    ...(M.lines||[]).flatMap(l => (PLAN.tracks[l.track]?.sub||"").split("、")),
    ...tools.flatMap(t => t.who.split("、"))
  ].filter(o => o && o !== "—" && o !== "負責人待定"))].join("、") || "待指派";

  const sig = JSON.stringify([progParts, nextParts, lineKpis, tools.map(t => t.lab), issues.map(x => x.title + x.ask)]);
  return {status, issues, prog:progParts.join(" "), next:nextParts.join(" "), tools, rel, lineKpis, owners, sig};
}

function lastChange(idx, M){
  for (let i = idx; i < REPORTS.length - 1; i++) if (modOf(REPORTS[i], M).sig !== modOf(REPORTS[i+1], M).sig) return REPORTS[i].date;
  return REPORTS[REPORTS.length - 1].date;
}

/* 單條子線橫向節點計算（基準日＝TODAY，確保 check_basedate.js 隨所選日報準確變動） */
function buildSteps(tr){
  const list = [
    ...tr.steps.map(x => !x.s
      ? {tbd:true, dt:"TBD", nm:x.short || x.n, k:x.kind === "try" ? "try" : "bar"}
      : {d:dn(x.s), end:x.e ? dn(x.e) : Infinity, dt:rng(x), nm:x.short || x.n, k:x.kind === "try" ? "try" : "bar"}),
    ...[...(tr.ms||[]), ...tr.steps.flatMap(x => x.ms||[])].map(m => m[0]
      ? {d:dn(m[0]), end:dn(m[0]), dt:md(m[0]), nm:m[1], k:m[2]}
      : {tbd:true, dt:"TBD", nm:m[1], k:m[2]})
  ];
  const dated = list.filter(x => !x.tbd).sort((a,b) => a.d - b.d);
  const lastD = dated.length ? dated[dated.length-1].d : TODAY + 60;
  list.forEach((x, i) => {
    if (x.tbd) {
      const nx = list.slice(i + 1).find(y => !y.tbd && y.k === "live") || list.slice(i + 1).find(y => !y.tbd);
      const rk = {first:1, stable:2, try:3}[x.k] || 0;
      x.d = x.end = (nx ? nx.d : lastD + 1) - 0.5 + rk * 0.01 + i * 0.0001;
    }
  });
  list.sort((a,b) => a.d - b.d);
  let nextTagged = false;
  return list.map(x => {
    let st = "", eta = "";
    if (x.tbd) { st = "tbd"; }
    else if (x.end < TODAY) { st = "past"; }
    else if (x.d <= TODAY) {
      st = "now";
      eta = x.end === Infinity ? "進行中" : (x.k === "bar" || x.k === "try") ? leftTxt(x.end) : "當天";
    } else if (!nextTagged) {
      nextTagged = true;
      eta = `${x.d - TODAY} 天後`;
    } else if (x.k === "live" && !list.some(y => !y.tbd && y.d > TODAY && y.k !== "live")) {
      eta = `${x.d - TODAY} 天後`;
    }
    let nd = "bar";
    if (x.k === "first") nd = x.tbd ? "o tbd" : "o";
    else if (x.k === "stable") nd = x.tbd ? "f tbd" : "f";
    else if (x.k === "gate") nd = "gate";
    else if (x.k === "live") nd = "live";
    else if (x.k === "try") nd = x.tbd ? "bar tbd" : "bar try";
    else nd = x.tbd ? "bar tbd" : st === "now" ? "bar now" : st === "past" ? "bar past" : "bar";
    return {...x, st, eta, nd};
  });
}

function render(){
  const idx = Math.max(0, REPORTS.findIndex(x => key(x.date) === location.hash.slice(1)));

  const mods = MODULES.map(M => {
    const cur = modOf(r, M), was = prev && modOf(prev, M);

    return {M, ...cur, changed, prevKpis, last: lastChange(idx, M)};

  const nActive = mods.filter(x => ["green","yellow","red"].includes(x.status)).length;

  const firstWarnId = (mods.find(x => x.status === "yellow") || mods[0]).M.id;

    <span class="st-item ${nDecide?"bad":"zero"}"><b class="num">${nDecide}</b><span>需決策</span></span>`;

  const dl = dn(PLAN.deadline);
  $("deadBadge").textContent = `◆ ${md(PLAN.deadline)} 上線・${leftTxt(dl)}`;

  /* ① 宏觀 6 列甘特圖 */
  const startD = dn(PLAN.from), totalDays = PLAN.weeks * 7;
  const pct = d => Math.max(0, Math.min(100, ((d - startD) / totalDays) * 100));
  const todayPct = ((TODAY - startD) / totalDays) * 100;
  const inAxis = todayPct >= 0 && todayPct <= 100;
  const deadPct = pct(dl);

  const months = [], weeks = [];
  let prevMo = -1;
  for (let w = 0; w < PLAN.weeks; w++) {
    const d = startD + w * 7;
    const dt = new Date(d * 864e5);
    const m = dt.getUTCMonth() + 1, dayN = dt.getUTCDate(), yr = dt.getUTCFullYear();
    weeks.push(`<span class="ax-wk" style="left:${(w / PLAN.weeks) * 100}%${w === 0 ? ";transform:none;padding-left:3px" : ""}">${m}/${dayN}</span>`);
    if (m !== prevMo) {
      prevMo = m;
      const moStart = Date.UTC(yr, m - 1, 1) / 864e5;
      const mp = Math.max(0, ((moStart - startD) / totalDays) * 100);
      months.push(`<span class="ax-mo" style="left:${mp}%">${m === 1 ? yr + "/" : ""}${m}月</span>`);
    }
  }

  const axisHTML = `
    <div class="g-row axis">
      <div class="g-left"></div>
      <div class="g-trk" style="--wks:${PLAN.weeks}">
        ${months.join("")}
        ${inAxis ? `<span class="todayl num" style="left:${todayPct}%">${md(r.date)}</span><div class="v-today" style="left:${todayPct}%;top:18px"></div>` : ""}
        <span class="deadl num" style="left:${deadPct}%">${md(PLAN.deadline)} 底線</span>
        <div class="v-dead" style="left:${deadPct}%;top:18px"></div>
        ${weeks.join("")}
      </div>
      <div class="g-right"></div>
      <div></div>
    </div>`;

  const rowsHTML = mods.map(x => {
    const M = x.M;
    const isSel = viewMode === "focus" && M.id === selectedId;
    const rowCls = ["g-row clickable", M.isInfra ? "infra-row" : "", x.status === "idle" ? "is-idle" : "", isSel ? "selected" : ""].filter(Boolean).join(" ");
    const barsHTML = M.macro.bars.map(b => {
      const l = pct(dn(b.s)), w = Math.max(2, pct(dn(b.e)) - l);
      let bcls = b.k === "try" ? "try" : b.k === "tbd" ? "tbd-tail" : b.k === "plan" ? "plan" : "plan";
      if (b.k === "build") {
        if (x.status === "idle") bcls = "idle";
        else if (dn(b.e) < TODAY) bcls = "past";
        else if (dn(b.s) <= TODAY) bcls = "now";
      }
      return `<div class="gbar ${bcls}" style="left:${l}%;width:${w}%">${esc(b.txt)}</div>`;
    }).join("");
    const mksHTML = (M.macro.mks||[]).map(([d, k, tip]) => `<div class="gmk ${k}" style="left:${pct(dn(d))}%" title="${esc(tip)}"></div>`).join("");
    const firstRisk = x.issues.find(i => i.type === "risk" || i.type === "decide");
    const rightInfo = firstRisk
      ? `${M.live ? `<span class="ot num">◆ ${esc(M.live)}</span>` : ""}<span class="wt">${esc(firstRisk.title)}</span>`
      : M.macro.rightOk;

    return `
      <div class="${rowCls}" role="button" tabindex="0" onclick="selectMod('${M.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMod('${M.id}')}">
        <div class="g-left">
          <div class="g-mtitle">
            ${M.no ? `<span class="g-mno num">${M.no}</span>` : ""}
            <span class="g-mname" style="${M.isInfra ? "color:var(--warn)" : ""}">${esc(M.name)}</span>
            ${x.changed ? `<i class="upd-dot"></i>` : ""}
          </div>
          <span class="st-pill ${x.status}">${ST_LABEL[x.status]}</span>
        </div>
        <div class="g-trk" style="--wks:${PLAN.weeks}">
          ${inAxis ? `<div class="v-today" style="left:${todayPct}%"></div>` : ""}
          <div class="v-dead" style="left:${deadPct}%"></div>
          ${barsHTML}${mksHTML}
        </div>
        <div class="g-right">${rightInfo}</div>
        <div class="g-chev">${CHEV_SVG}</div>
      </div>`;
  }).join("");

  $("gantt").innerHTML = axisHTML + rowsHTML;

  /* ② 模塊詳情渲染 */
  $("btnFocus").classList.toggle("active", viewMode === "focus");
  $("btnAll").classList.toggle("active", viewMode === "all");

  const cardHTML = x => {
    const M = x.M;
    const cCls = ["mcard", x.status === "yellow" ? "is-yellow" : x.status === "red" ? "is-red" : x.status === "idle" ? "is-idle" : ""].filter(Boolean).join(" ");
    const linesHTML = M.lines.map((l, li) => {
      const tr = PLAN.tracks[l.track];
      const steps = buildSteps(tr);
      const kpi = x.lineKpis[li];
      const lineChanged = x.prevKpis.length && x.prevKpis[li] !== kpi && kpi && kpi !== "未開始";
      const kpiCls = /不足|重啟|爆滿|分析/.test(kpi) ? "warn" : (!kpi || kpi === "未開始") ? "idle" : "";
      return `
        <div class="line">
          <div>
            <div class="tl-name">${esc(tr.label)}${lineChanged ? `<span class="chip-upd">更新</span>` : ""}</div>
            <div class="tl-who">${esc(tr.sub)}</div>
            ${kpi && kpi !== "未開始" ? `<span class="tl-kpi ${kpiCls} num">${esc(kpi)}</span>` : ""}
          </div>
          <ol class="hsteps" style="--n:${steps.length}">
            ${steps.map(st => `
              <li class="${st.st} ${st.k === "live" ? "live" : ""}">
                <span class="nd nd-${st.nd}"></span>
                <span class="dt">${esc(st.dt)}</span>
                <span class="nm">${esc(st.nm)}</span>
                ${st.eta ? `<span class="eta num">${esc(st.eta)}</span>` : ""}
              </li>`).join("")}
          </ol>
        </div>`;
    }).join("");

    const execHTML = (x.prog || x.next) ? `
      <div class="exec-2col ${x.prog && x.next ? "" : "one"}">
        ${x.prog ? `<div class="exec-box"><h4>進展</h4><div>${esc(x.prog)}</div></div>` : ""}
        ${x.next ? `<div class="exec-box"><h4>下一步</h4><div>${esc(x.next)}</div></div>` : ""}
      </div>` : "";

    const risksHTML = x.issues.filter(i => i.type === "risk" || i.type === "decide").map(i =>
      `<div class="risk-box ${i.type === "decide" ? "decide" : ""}"><span class="rk">${i.type === "decide" ? "■ 需決策" : "▲ 待追蹤"}</span><div><strong>${esc(i.title)}：</strong>${esc(i.ask)}</div></div>`).join("");
    const handledHTML = x.issues.filter(i => i.type === "handled").map(i =>
      `<div class="handled-box"><span class="hk">✓ 已有對策</span><span>${esc(i.title)} → ${esc(i.ask)}</span></div>`).join("");

    const chipList = (x.tools.length ? x.tools : x.rel).map(t =>
      `<span class="rel-chip"><b>${esc(t.name)}</b><span class="who">${esc(t.who)}</span><span class="${t.k}">${t.k === "done" ? "✓ " : ""}${esc(t.lab)}</span></span>`).join("");
    const relHTML = chipList ? `<div class="rel-row">${chipList}</div>` : "";

    return `
      <article class="${cCls}" id="card-${M.id}">
        <header class="mcard-hd">
          <div class="mcard-hl">
            <h3>${M.no ? `<span class="no num">${M.no}</span>` : ""}${esc(M.name)}${M.subname ? `<span class="subnm">${esc(M.subname)}</span>` : ""}</h3>
            ${M.live ? `<span class="chip-live num">◆ ${esc(M.live)}</span>` : ""}
            ${x.changed ? `<span class="chip-upd">今日更新</span>` : ""}
            <span class="st-pill ${x.status}">${ST_LABEL[x.status]}</span>
          </div>
          <div class="mcard-meta num">
            <span>${USER_SVG}${esc(x.owners)}</span>
            <span>${CLOCK_SVG}${md(x.last)}</span>
          </div>
        </header>
        <div class="mcard-body">
          <div>${linesHTML}</div>
          ${execHTML}${risksHTML}${handledHTML}${relHTML}
        </div>
      </article>`;
  };

  if (viewMode === "focus") {
    $("detailHeadL").innerHTML = `<h2 id="s2">模塊詳情</h2><div class="mod-pills">${mods.map(x => `
      <button class="mpill ${x.M.id === selectedId ? "active" : ""} ${x.status === "yellow" ? "warn-p" : x.status === "red" ? "red-p" : ""}" type="button" onclick="selectMod('${x.M.id}')">
        ${x.M.no ? `<span class="num">${x.M.no}</span>` : ""}${esc(x.M.name)}
      </button>`).join("")}</div>`;
    const cur = mods.find(x => x.M.id === selectedId) || mods[0];
    const radarHTML = allRisks.length ? allRisks.map(rk => `
      <button class="radar-item ${rk.modId === selectedId ? "is-cur" : ""}" type="button" onclick="selectMod('${rk.modId}')">
        <div>
          <div class="r-mod">${esc(rk.modTitle)}</div>
          <b class="r-title">${esc(rk.title)}</b>
          ${esc(rk.ask)}
        </div>
        <span class="r-arr">${ARR_R}</span>
      </button>`).join("") : `<div class="radar-empty">無待追蹤風險</div>`;

    $("detailArea").innerHTML = `
      <div class="focus-grid">
        <div>${cardHTML(cur)}</div>
        <aside class="radar" aria-label="待追蹤風險">
          <div class="radar-hd"><span>▲ 待追蹤風險</span><span class="radar-cnt num">${allRisks.length}</span></div>
          ${radarHTML}
        </aside>
      </div>`;
  } else {
    $("detailHeadL").innerHTML = `<h2 id="s2">模塊詳情</h2>`;
    $("detailArea").innerHTML = `<div class="all-stack">${mods.map(cardHTML).join("")}</div>`;
  }
}

function selectMod(id){
  selectedId = id;
  render();
  if (viewMode === "all") {
    const el = document.getElementById("card-" + id);
    if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

$("date").addEventListener("change", e => { location.hash = e.target.value; });
addEventListener("hashchange", render);
$("btnFocus").addEventListener("click", () => { viewMode = "focus"; render(); });
$("btnAll").addEventListener("click", () => { viewMode = "all"; render(); });
render();
</script>
</body>
</html>
